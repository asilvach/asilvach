<style>
/* Hallmark · built: Claude Code · redesign of an app screen · shape: app screen · genre: modern-minimal · theme: custom · brand: Natixis (spec 2026-11-05, marca/brand-spec.md) · surface: tinted · nav: sidebar (meeting list is the destination set) · signature: the speaking ribbon (who spoke when) · motion: state only · v2.0.0 */

/* ═══════════ Tokens ═══════════
   Cores da marca extraídas de natixis.groupebpce.com (CSS oficial), não de memória.
   Neutros com tinta do violeta (h 312). Contrastes verificados em marca/brand-spec.md. */
:root {
  --font-ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;

  --t-xs: 12px; --t-sm: 13px; --t-base: 15px; --t-md: 16px; --t-lg: 18px; --t-xl: 22px; --t-2xl: 27px;
  --lh-tight: 1.2; --lh: 1.55;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px; --s-16: 64px;
  --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 999px;
  --sidebar: 288px; --measure: 68ch; --container: 1120px; --reader: 820px;
  --ease-out: cubic-bezier(.23, 1, .32, 1); --ease-drawer: cubic-bezier(.32, .72, 0, 1);
  --dur-micro: 120ms; --dur-short: 180ms; --dur-drawer: 280ms;

  /* Superfícies e tinta (claro) */
  --paper: #fdfcfe; --side: #f7f4f9; --fill: #f1edf4; --line: #e2dde6; --edge: #968f9b;
  --ink: #1c1521; --ink-2: #433d48; --ink-3: #66616a;
  /* Marca */
  --brand: #581d74; --brand-ink: #fdfcfe; --brand-soft: #f5e9fd; --brand-line: #d1bae1; --brand-text: #581d74;
  --coral: #ff7645;
  /* Estados */
  --ok: #006e30; --ok-soft: #e3f6e6; --warn: #915200; --warn-soft: #fff0d0; --bad: #ba2b28; --bad-soft: #ffe9e5;
  --mark: #ffd0a2; --ring: #581d74; --scrim: rgb(28 21 33 / .4); --shadow: 0 1px 2px rgb(28 21 33 / .05);
  --pop-shadow: 0 16px 48px -12px rgb(28 21 33 / .28);
  /* Oradores: o "eu" é sempre o violeta da marca; os outros, uma paleta própria em OKLCH */
  --sp0: #581d74; --sp1: #e87045; --sp2: #0f9293; --sp3: #ca9d33; --sp4: #4379bc; --sp5: #439458; --sp6: #7f7780;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #100d12; --side: #161218; --fill: #211c24; --line: #2c272f; --edge: #67606c;
  --ink: #f4f0f6; --ink-2: #d0ccd4; --ink-3: #a19ca5;
  --brand: #c296dd; --brand-ink: #100d12; --brand-soft: #392247; --brand-line: #664679; --brand-text: #d9b9ec;
  --ok: #76cf8a; --ok-soft: #172c1c; --warn: #e8be62; --warn-soft: #342a13; --bad: #f6857a; --bad-soft: #3e1f1b;
  --mark: #794819; --ring: #c296dd; --scrim: rgb(0 0 0 / .55); --shadow: 0 0 0 1px rgb(244 240 246 / .02);
  --pop-shadow: 0 16px 48px -12px rgb(0 0 0 / .6);
  --sp0: #c296dd; --sp1: #ff8a5e; --sp2: #50bfbe; --sp3: #ebbd57; --sp4: #6fa7ee; --sp5: #73c385; --sp6: #a39ba4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #100d12; --side: #161218; --fill: #211c24; --line: #2c272f; --edge: #67606c;
    --ink: #f4f0f6; --ink-2: #d0ccd4; --ink-3: #a19ca5;
    --brand: #c296dd; --brand-ink: #100d12; --brand-soft: #392247; --brand-line: #664679; --brand-text: #d9b9ec;
    --ok: #76cf8a; --ok-soft: #172c1c; --warn: #e8be62; --warn-soft: #342a13; --bad: #f6857a; --bad-soft: #3e1f1b;
    --mark: #794819; --ring: #c296dd; --scrim: rgb(0 0 0 / .55); --shadow: 0 0 0 1px rgb(244 240 246 / .02);
    --pop-shadow: 0 16px 48px -12px rgb(0 0 0 / .6);
    --sp0: #c296dd; --sp1: #ff8a5e; --sp2: #50bfbe; --sp3: #ebbd57; --sp4: #6fa7ee; --sp5: #73c385; --sp6: #a39ba4;
  }
}

/* ═══════════ Base ═══════════ */
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { -webkit-text-size-adjust: 100%; }
@media (pointer: fine) { html { overscroll-behavior: none; } }
body { margin: 0; min-height: 100dvh; background: var(--paper); color: var(--ink); font: var(--t-base)/var(--lh) var(--font-ui); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: var(--r-sm); }
[tabindex="-1"]:focus { outline: none; }
h1, h2, h3 { text-wrap: balance; overflow-wrap: break-word; min-width: 0; }
p, li { text-wrap: pretty; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: var(--s-4); top: var(--s-4); z-index: 50; padding: var(--s-2) var(--s-3); background: var(--brand); color: var(--brand-ink); border-radius: var(--r-md); transform: translateY(-200%); }
.skip:focus { transform: none; }
.icon { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.tabular, .n { font-variant-numeric: tabular-nums; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
.muted { color: var(--ink-3); }

/* ═══════════ Moldura ═══════════ */
.app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); height: 100dvh; }
#sidebar { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#main { overflow-y: auto; min-width: 0; }
.page { max-width: var(--reader); margin: 0 auto; padding: var(--s-10) var(--s-10) var(--s-16); }
.page.wide { max-width: var(--container); }
.topbar, .scrim { display: none; }

/* Marca */
.brand { padding: var(--s-6) var(--s-5) var(--s-4); display: grid; gap: var(--s-3); }
.brand-logo { color: var(--ink); width: 100%; max-width: 212px; }
.brand-logo svg { display: block; width: 100%; height: auto; }
.brand-team { display: grid; gap: 2px; }
.brand-team b { font-size: var(--t-sm); font-weight: 600; color: var(--ink); }
.brand-team span { font-size: var(--t-xs); color: var(--ink-3); }

.cmdk-trigger { margin: 0 var(--s-3) var(--s-2); display: flex; align-items: center; gap: var(--s-2); height: 36px; padding: 0 var(--s-3); border: 1px solid var(--line); border-radius: var(--r-md); background: var(--paper); color: var(--ink-3); text-align: left; }
.cmdk-trigger span { flex: 1; }
.kbd { font: 500 var(--t-xs)/1 var(--font-ui); padding: 3px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; color: var(--ink-3); background: var(--paper); white-space: nowrap; }
.nav { padding: var(--s-1) var(--s-2) var(--s-3); display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; gap: var(--s-3); min-height: 36px; padding: 0 var(--s-3); border-radius: var(--r-md); text-decoration: none; color: var(--ink-2); }
.nav a[aria-current="page"] { background: var(--brand-soft); color: var(--brand-text); font-weight: 600; }
.nav .count { margin-left: auto; font-size: var(--t-xs); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nav .count.late { color: var(--bad); font-weight: 600; }
.list-head { border-top: 1px solid var(--line); padding: var(--s-4) var(--s-3) var(--s-2); display: grid; gap: var(--s-2); }
.list-title { display: flex; justify-content: space-between; align-items: baseline; padding: 0 var(--s-1); font-size: var(--t-sm); font-weight: 600; color: var(--ink-2); }
.list-title output { font-weight: 400; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.field { position: relative; }
.field .icon { position: absolute; left: var(--s-3); top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.input { width: 100%; height: 36px; padding: 0 var(--s-3) 0 36px; border: 1px solid var(--edge); border-radius: var(--r-md); background: var(--paper); font-size: var(--t-sm); outline: none; }
.input:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: var(--s-1); }
.chip { min-height: 28px; padding: 0 var(--s-3); border-radius: var(--r-full); border: 1px solid var(--line); background: transparent; color: var(--ink-2); font-size: var(--t-xs); }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
#list { overflow-y: auto; flex: 1; padding: 0 var(--s-2) var(--s-4); overscroll-behavior: contain; }
.list-label { position: sticky; top: 0; z-index: 1; background: var(--side); padding: var(--s-3) var(--s-3) var(--s-1); font-size: var(--t-xs); font-weight: 600; color: var(--ink-3); }
.list-label::first-letter { text-transform: uppercase; }
.m-item { display: grid; gap: 2px; padding: var(--s-2) var(--s-3); border-radius: var(--r-md); text-decoration: none; content-visibility: auto; contain-intrinsic-size: auto 64px; }
.m-item[aria-current="page"] { background: var(--brand-soft); }
.m-item[aria-current="page"] .m-title { color: var(--brand-text); }
.m-title { font-weight: 500; font-size: var(--t-sm); line-height: 1.35; overflow-wrap: break-word; }
.m-meta { display: flex; align-items: center; gap: var(--s-3); font-size: var(--t-xs); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.m-meta .badge { margin-left: auto; }
.m-snip { font-size: var(--t-xs); color: var(--ink-3); line-height: 1.45; overflow-wrap: break-word; }
.list-empty { padding: var(--s-6) var(--s-3); color: var(--ink-3); text-align: center; font-size: var(--t-sm); }
.side-foot { border-top: 1px solid var(--line); padding: var(--s-2) var(--s-3); display: flex; gap: var(--s-2); align-items: center; font-size: var(--t-xs); color: var(--ink-3); }
.side-foot span { flex: 1; }

/* Peças */
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border: 0; border-radius: var(--r-md); background: transparent; color: var(--ink-3); position: relative; }
.icon-btn::after { content: ""; position: absolute; inset: -4px; }
.btn { display: inline-flex; align-items: center; gap: var(--s-2); min-height: 36px; padding: 0 var(--s-4); border-radius: var(--r-md); border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-weight: 500; font-size: var(--t-sm); text-decoration: none; white-space: nowrap; }
.btn-link { color: var(--brand-text); font-size: var(--t-sm); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--brand-line); white-space: nowrap; }
.btn, .icon-btn, .chip, .seg button, .cmdk-trigger { transition: transform var(--dur-micro) var(--ease-out); }
.btn:active, .icon-btn:active, .chip:active, .seg button:active, .cmdk-trigger:active { transform: scale(.97); }
.badge { display: inline-flex; align-items: center; min-height: 22px; padding: 0 var(--s-2); border-radius: var(--r-sm); background: var(--fill); font-size: var(--t-xs); font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.badge.me { background: var(--brand-soft); color: var(--brand-text); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-5) var(--s-6); min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); margin: 0 0 var(--s-4); }
.panel-head h2 { font-size: var(--t-md); font-weight: 600; margin: 0; }
.panel-head p { margin: 0; font-size: var(--t-xs); color: var(--ink-3); }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--fill); border-radius: var(--r-md); }
.seg button { min-height: 32px; padding: 0 var(--s-3); border: 0; border-radius: var(--r-sm); background: transparent; color: var(--ink-2); font-size: var(--t-sm); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: var(--shadow), 0 0 0 1px var(--line); }
.avatar { width: 28px; height: 28px; border-radius: var(--r-full); display: inline-grid; place-items: center; font-size: var(--t-xs); font-weight: 600; color: var(--paper); background: var(--c, var(--sp6)); flex-shrink: 0; }
.key { width: 10px; height: 10px; border-radius: 3px; background: var(--c, var(--sp6)); display: inline-block; flex-shrink: 0; }
.callout { display: flex; gap: var(--s-3); align-items: flex-start; padding: var(--s-3) var(--s-4); border-radius: var(--r-md); background: var(--brand-soft); color: var(--ink); font-size: var(--t-sm); }
.callout .icon { color: var(--brand-text); margin-top: 3px; }
.callout p { margin: 0; }
.empty { padding: var(--s-12) var(--s-6); color: var(--ink-3); max-width: 46ch; }
.empty h2 { color: var(--ink); font-size: var(--t-lg); margin: 0 0 var(--s-2); }
.empty ol { padding-left: var(--s-5); margin: var(--s-3) 0 0; }
.empty li { margin-bottom: var(--s-1); }
code { font-family: var(--font-mono); font-size: .9em; background: var(--fill); padding: 1px var(--s-1); border-radius: 4px; }

@media (hover: hover) and (pointer: fine) {
  .nav a, .m-item, .chip, .icon-btn, .btn, .cmdk-trigger, .row-link, .tag-btn, .person-btn, .pager a { transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease, transform var(--dur-micro) var(--ease-out); }
  .nav a:hover { background: var(--fill); color: var(--ink); }
  .nav a[aria-current="page"]:hover { background: var(--brand-soft); color: var(--brand-text); }
  .m-item:hover { background: var(--fill); }
  .m-item[aria-current="page"]:hover { background: var(--brand-soft); }
  .chip:hover { border-color: var(--edge); color: var(--ink); }
  .icon-btn:hover { background: var(--fill); color: var(--ink); }
  .btn:hover { background: var(--fill); }
  .btn-link:hover { text-decoration-color: currentColor; }
  .cmdk-trigger:hover { border-color: var(--edge); }
  .row-link:hover .row-title, .person-btn:hover { color: var(--brand-text); }
  .tag-btn:hover { background: var(--brand-soft); color: var(--brand-text); }
  .pager a:hover { border-color: var(--brand-line); }
}

/* ═══════════ Páginas ═══════════ */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s-4); flex-wrap: wrap; margin-bottom: var(--s-8); }
.page h1 { font-size: var(--t-2xl); line-height: var(--lh-tight); letter-spacing: -.015em; font-weight: 650; margin: 0; }
.page-sub { color: var(--ink-3); margin: var(--s-2) 0 0; font-size: var(--t-base); }
.crumbs { display: flex; gap: var(--s-2); align-items: center; font-size: var(--t-sm); color: var(--ink-3); margin-bottom: var(--s-3); }
.crumbs a { text-decoration: none; }
.crumbs a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.stack { display: grid; gap: var(--s-6); }
.cols-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-6); }
.cols-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-4); }

/* Linha de números (sem cartões) */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--paper); }
.stat { padding: var(--s-4) var(--s-5); border-left: 1px solid var(--line); min-width: 0; }
.stat:first-child { border-left: 0; }
.stat-v { font-size: var(--t-xl); font-weight: 650; line-height: var(--lh-tight); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.stat-l { font-size: var(--t-sm); color: var(--ink-2); margin-top: var(--s-1); display: flex; gap: var(--s-2); align-items: center; flex-wrap: wrap; }
.stat-h { font-size: var(--t-xs); color: var(--ink-3); margin-top: 2px; }

/* Listas de linhas */
.rows { display: grid; }
.row-link { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) 0; border-top: 1px solid var(--line); text-decoration: none; min-width: 0; }
.rows > :first-child { border-top: 0; padding-top: 0; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 500; overflow-wrap: break-word; }
.row-sub { font-size: var(--t-xs); color: var(--ink-3); display: flex; gap: var(--s-3); flex-wrap: wrap; font-variant-numeric: tabular-nums; }

/* ═══════════ Assinatura: a fita de quem falou quando ═══════════ */
.ribbon { margin: var(--s-6) 0 var(--s-2); }
.ribbon-track { position: relative; height: 32px; border-radius: var(--r-sm); background: var(--fill); overflow: hidden; }
.ribbon-track svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ribbon rect { fill: var(--c); transition: opacity 150ms ease; }
.ribbon[data-focus="0"] rect:not([data-s="0"]), .ribbon[data-focus="1"] rect:not([data-s="1"]), .ribbon[data-focus="2"] rect:not([data-s="2"]),
.ribbon[data-focus="3"] rect:not([data-s="3"]), .ribbon[data-focus="4"] rect:not([data-s="4"]), .ribbon[data-focus="5"] rect:not([data-s="5"]),
.ribbon[data-focus="6"] rect:not([data-s="6"]) { opacity: .15; }
.ribbon-axis { display: flex; justify-content: space-between; font-size: var(--t-xs); color: var(--ink-3); margin-top: var(--s-1); font-variant-numeric: tabular-nums; }
.ribbon-keys { display: flex; flex-wrap: wrap; gap: var(--s-1) var(--s-2); margin-top: var(--s-3); }
.ribbon-key { display: inline-flex; align-items: center; gap: var(--s-2); min-height: 32px; padding: 0 var(--s-3) 0 var(--s-2); border: 1px solid var(--line); border-radius: var(--r-full); background: var(--paper); font-size: var(--t-sm); color: var(--ink-2); }
.ribbon-key b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.ribbon-key[aria-pressed="true"] { border-color: var(--brand-line); background: var(--brand-soft); }

/* Reunião */
.r-title-row { display: flex; align-items: flex-start; gap: var(--s-4); }
.r-title-row h1 { flex: 1; }
.r-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2) var(--s-5); color: var(--ink-3); font-size: var(--t-sm); margin-top: var(--s-3); }
.r-meta > span { display: inline-flex; align-items: center; gap: var(--s-2); }
.tags { display: flex; flex-wrap: wrap; gap: var(--s-1); margin-top: var(--s-3); }
.tag-btn { border: 0; background: var(--fill); color: var(--ink-2); border-radius: var(--r-sm); min-height: 26px; padding: 0 var(--s-2); font-size: var(--t-xs); }
.r-body > section, .r-block { margin-top: var(--s-10); }
.r-body h2, .r-block > h2 { font-size: var(--t-lg); font-weight: 600; letter-spacing: -.005em; margin: 0 0 var(--s-4); scroll-margin-top: var(--s-4); }
.r-body h3 { font-size: var(--t-base); font-weight: 600; margin: var(--s-5) 0 var(--s-2); display: flex; gap: var(--s-2); align-items: center; }
.r-body h3 .icon { color: var(--brand-text); }
.r-body p { margin: 0 0 var(--s-3); color: var(--ink-2); max-width: var(--measure); }
.r-body ul, .r-body ol { padding-left: var(--s-5); margin: 0 0 var(--s-3); color: var(--ink-2); max-width: var(--measure); }
.r-body li { margin-bottom: var(--s-2); padding-left: 2px; }
.r-body li::marker { color: var(--ink-3); }
.r-body strong { color: var(--ink); font-weight: 600; }
.r-body em { color: var(--ink); }
.lead { font-size: var(--t-md) !important; line-height: 1.65; color: var(--ink) !important; }
.decision, .risk { display: flex; gap: var(--s-3); align-items: flex-start; padding: var(--s-3) 0; border-top: 1px solid var(--line); color: var(--ink-2); max-width: var(--measure); }
.decision:first-of-type, .risk:first-of-type { border-top: 0; padding-top: 0; }
.decision > .icon { color: var(--ok); margin-top: 3px; }
.risk > .icon { color: var(--bad); margin-top: 3px; }
.todo-item { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s-3); padding: var(--s-3) 0; border-top: 1px solid var(--line); }
.todo-item:first-of-type { border-top: 0; padding-top: 0; }
.todo-item label, .task label { display: flex; gap: var(--s-3); align-items: flex-start; cursor: pointer; flex: 1; min-width: 0; color: var(--ink); }
.todo-item input, .task input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--brand); flex-shrink: 0; cursor: pointer; }
.todo-item input:checked + span, .task.done .task-text { text-decoration: line-through; color: var(--ink-3); }
.todo-side, .task-side { display: flex; gap: var(--s-1); flex-shrink: 0; align-items: center; }
.todo-badge { display: none; } /* o caderno desenha o responsável e o prazo a partir de data-owner e data-due */
.r-body blockquote { margin: var(--s-3) 0; padding-left: var(--s-4); border-left: 2px solid var(--brand-line); color: var(--ink-2); max-width: var(--measure); }
.r-body table, .tbl { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
.r-body th, .r-body td, .tbl th, .tbl td { padding: var(--s-2) var(--s-3); border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.r-body th, .tbl th { font-weight: 500; color: var(--ink-3); font-size: var(--t-xs); white-space: nowrap; }
.r-body td.num, .r-body th.num, .tbl .n { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td { white-space: nowrap; vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.r-body .tag, .radar-metrics { display: none; }
.who { display: inline-flex; align-items: center; gap: var(--s-2); }
.mini { display: inline-block; width: 56px; height: 6px; border-radius: var(--r-full); background: var(--fill); vertical-align: middle; margin-left: var(--s-2); overflow: hidden; }
.mini i { display: block; height: 100%; width: 100%; background: var(--c); border-radius: inherit; transform-origin: left; transform: scaleX(var(--p)); }
.lanes { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s-1) var(--s-3); align-items: center; margin-top: var(--s-5); }
.lane-name { font-size: var(--t-xs); color: var(--ink-2); max-width: 140px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.lane { height: 14px; border-radius: 4px; background: var(--fill); overflow: hidden; }
.lane svg { display: block; width: 100%; height: 100%; }
.lane rect { fill: var(--c); }
.equity { display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-6); font-size: var(--t-sm); color: var(--ink-3); margin-bottom: var(--s-4); }
.equity b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

/* Radar */
.radar { border-top: 2px solid var(--brand); padding-top: var(--s-6); }
.radar-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; margin-bottom: var(--s-6); }
.radar-stat { padding: var(--s-3) var(--s-4); min-width: 0; box-shadow: 1px 0 0 var(--line), 0 1px 0 var(--line); }
.radar-stat .top { display: flex; justify-content: space-between; align-items: center; gap: var(--s-2); font-size: var(--t-xs); color: var(--ink-3); }
.radar-stat .v { font-size: var(--t-lg); font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
.radar-stat .h { font-size: var(--t-xs); color: var(--ink-3); margin-top: 2px; overflow-wrap: break-word; }
.tip { margin-top: var(--s-5); padding: var(--s-4); border-radius: var(--r-md); background: var(--brand-soft); color: var(--ink); max-width: var(--measure); }
.tip strong { color: var(--brand-text) !important; }
.notes textarea { width: 100%; min-height: 128px; resize: vertical; padding: var(--s-3); border: 1px solid var(--edge); border-radius: var(--r-md); background: var(--paper); line-height: var(--lh); outline: none; }
.notes textarea:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.note-status { font-size: var(--t-xs); color: var(--ink-3); min-height: 18px; margin-top: var(--s-1); }
.pager { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s-3); margin-top: var(--s-12); }
.pager a { display: grid; gap: 2px; padding: var(--s-3) var(--s-4); border: 1px solid var(--line); border-radius: var(--r-lg); text-decoration: none; min-width: 0; }
.pager small { color: var(--ink-3); font-size: var(--t-xs); }
.pager span { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pager .next { text-align: right; grid-column: 2; }

/* Tarefas */
.toolbar { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; margin-bottom: var(--s-6); }
.task-group + .task-group { margin-top: var(--s-8); }
.task-group h2 { font-size: var(--t-base); font-weight: 600; margin: 0 0 var(--s-2); display: flex; gap: var(--s-2); align-items: baseline; }
.task-group h2 .count { color: var(--ink-3); font-weight: 400; font-variant-numeric: tabular-nums; }
.task-group h2.late { color: var(--bad); }
.task { display: flex; flex-wrap: wrap; gap: var(--s-1) var(--s-3); align-items: flex-start; padding: var(--s-3) 0; border-top: 1px solid var(--line); }
.task:first-child { border-top: 0; }
.task-text { display: block; overflow-wrap: break-word; }
.task-from { flex-basis: 100%; padding-left: calc(18px + var(--s-3)); font-size: var(--t-xs); color: var(--ink-3); }
.task-from:hover { color: var(--brand-text); }

/* Pessoas */
.person-btn { border: 0; background: none; padding: 0; text-align: left; font-weight: 500; display: inline-flex; align-items: center; gap: var(--s-3); min-height: 36px; }

/* Evolução */
.chart-panel .big { font-size: var(--t-xl); font-weight: 650; font-variant-numeric: tabular-nums; }
.trend { font-size: var(--t-xs); font-weight: 500; }
.trend.up { color: var(--ok); } .trend.down { color: var(--bad); } .trend.flat { color: var(--ink-3); }
.chart { width: 100%; height: auto; display: block; margin-top: var(--s-3); overflow: visible; }
.chart .band { fill: var(--ok-soft); }
.chart .ref { stroke: var(--edge); stroke-dasharray: 3 3; }
.chart .ax { fill: var(--ink-3); font-size: 10px; font-family: var(--font-ui); font-variant-numeric: tabular-nums; }
.chart .line { fill: none; stroke: var(--brand); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart circle { fill: var(--paper); stroke: var(--brand); stroke-width: 2; }
.chart circle.last { fill: var(--brand); }
.hbar { display: grid; grid-template-columns: 120px minmax(0, 1fr) 36px; gap: var(--s-3); align-items: center; font-size: var(--t-sm); margin-bottom: var(--s-2); }
.hbar-track { height: 8px; border-radius: var(--r-full); background: var(--fill); overflow: hidden; }
.hbar-track i { display: block; height: 100%; width: 100%; background: var(--coral); border-radius: inherit; transform-origin: left; transform: scaleX(var(--p)); }
.verdicts { display: grid; gap: var(--s-2); margin: 0; padding: 0; list-style: none; }
.verdicts li { display: flex; gap: var(--s-3); align-items: baseline; justify-content: space-between; }

/* ═══════════ Paleta ⌘K (sem animação: abre-se dezenas de vezes por dia) ═══════════ */
#cmdk { padding: 0; border: 1px solid var(--line); border-radius: var(--r-lg); width: min(640px, calc(100vw - 32px)); max-height: min(520px, calc(100dvh - 120px)); margin: 12dvh auto auto; background: var(--paper); color: var(--ink); box-shadow: var(--pop-shadow); overflow: hidden; }
#cmdk[open] { display: flex; flex-direction: column; }
#cmdk::backdrop { background: var(--scrim); }
.cmdk-input { display: flex; align-items: center; gap: var(--s-3); padding: 0 var(--s-4); border-bottom: 1px solid var(--line); }
.cmdk-input input { flex: 1; height: 52px; border: 0; outline: none; background: transparent; font-size: var(--t-md); }
#cmdk-list { overflow-y: auto; padding: var(--s-2); margin: 0; list-style: none; overscroll-behavior: contain; }
.cmdk-group { padding: var(--s-2) var(--s-2) var(--s-1); font-size: var(--t-xs); font-weight: 600; color: var(--ink-3); }
.cmdk-item { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-2) var(--s-3); border-radius: var(--r-md); cursor: pointer; scroll-margin: var(--s-2); }
.cmdk-item[aria-selected="true"] { background: var(--brand-soft); }
.cmdk-item[aria-selected="true"] .cmdk-title { color: var(--brand-text); }
.cmdk-item .icon { color: var(--ink-3); }
.cmdk-main { flex: 1; min-width: 0; }
.cmdk-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmdk-snip { display: block; font-size: var(--t-xs); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmdk-foot { display: flex; flex-wrap: wrap; gap: var(--s-4); padding: var(--s-2) var(--s-4); border-top: 1px solid var(--line); font-size: var(--t-xs); color: var(--ink-3); }
.cmdk-foot span { display: inline-flex; gap: var(--s-1); align-items: center; }

/* Sem JavaScript: as reuniões continuam legíveis */
#meetings-container { max-width: var(--reader); margin: 0 auto; padding: var(--s-10) var(--s-6); }
.js #meetings-container { display: none; }
.noscript { padding: var(--s-4) var(--s-6); background: var(--warn-soft); color: var(--warn); }

/* ═══════════ Ecrãs pequenos (abaixo de 60rem) ═══════════ */
@media (max-width: 1100px) { .cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 60rem) {
  .app { grid-template-columns: minmax(0, 1fr); }
  #sidebar { position: fixed; inset: 0 auto 0 0; width: min(320px, 86vw); z-index: 30; transform: translateX(-100%); transition: transform 200ms var(--ease-out); box-shadow: var(--pop-shadow); visibility: hidden; }
  body.nav-open #sidebar { transform: none; transition-duration: var(--dur-drawer); transition-timing-function: var(--ease-drawer); visibility: visible; }
  .scrim { display: block; position: fixed; inset: 0; background: var(--scrim); z-index: 25; opacity: 0; pointer-events: none; transition: opacity 200ms ease; }
  body.nav-open .scrim { opacity: 1; pointer-events: auto; }
  .topbar { display: flex; align-items: center; gap: var(--s-2); position: sticky; top: 0; z-index: 10; min-height: 52px; padding: 0 var(--s-2); padding-top: env(safe-area-inset-top); background: var(--paper); border-bottom: 1px solid var(--line); }
  .topbar strong { flex: 1; font-weight: 600; font-size: var(--t-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .page { padding: var(--s-6) var(--s-4) var(--s-12); }
  .page h1 { font-size: var(--t-xl); }
  .cols-2, .cols-3 { grid-template-columns: minmax(0, 1fr); }
  .stat { border-left: 0; border-top: 1px solid var(--line); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(-n+2) { border-top: 0; }
  .stat:nth-child(even) { border-left: 1px solid var(--line); }
  .input, .cmdk-input input, .notes textarea { font-size: var(--t-md); }
  .todo-item, .task { flex-wrap: wrap; }
  .todo-side, .task-side { padding-left: 30px; }
  .pager { grid-template-columns: minmax(0, 1fr); } .pager .next { grid-column: 1; }
}
@media (hover: none) { .chip, .seg button, .tag-btn { min-height: 40px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media print {
  #sidebar, .topbar, .scrim, .r-actions, .notes, .pager, #cmdk, .ribbon-keys { display: none !important; }
  .app { display: block; height: auto; } #main { overflow: visible; } .page { padding: 0; max-width: none; }
  .panel, .radar-stats { break-inside: avoid; }
}

/* ═══════════ v4: caderno autónomo (assistente, armazenamento, transcrição) ═══════════ */
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-lg { min-height: 44px; padding: 0 var(--s-5); font-size: var(--t-base); }
.actions { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; }
.field-label { display: block; font-size: var(--t-sm); font-weight: 600; color: var(--ink); margin-bottom: var(--s-1); }
.field-help { font-size: var(--t-xs); color: var(--ink-3); margin: var(--s-1) 0 0; }
.text-input, .text-area { width: 100%; border: 1px solid var(--edge); border-radius: var(--r-md); background: var(--paper); padding: var(--s-2) var(--s-3); font-size: var(--t-base); outline: none; }
.text-input { min-height: 40px; }
.text-area { min-height: 160px; resize: vertical; font-family: var(--font-mono); font-size: var(--t-sm); line-height: 1.5; }
.text-input:focus-visible, .text-area:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-4); }
.step { border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-5) var(--s-6); background: var(--paper); }
.step + .step { margin-top: var(--s-4); }
.step[aria-disabled="true"] { opacity: .5; }
.step[aria-disabled="true"] :is(button, input, textarea, label) { pointer-events: none; }
.step-head { display: flex; gap: var(--s-3); align-items: baseline; margin-bottom: var(--s-4); }
.step-num { width: 28px; height: 28px; border-radius: var(--r-full); display: inline-grid; place-items: center; background: var(--brand-soft); color: var(--brand-text); font-weight: 650; font-size: var(--t-sm); flex-shrink: 0; }
.step.done .step-num { background: var(--ok-soft); color: var(--ok); }
.step-head h2 { margin: 0; font-size: var(--t-md); font-weight: 600; }
.step-head p { margin: 2px 0 0; font-size: var(--t-sm); color: var(--ink-3); }
.drop { display: grid; place-items: center; gap: var(--s-2); text-align: center; padding: var(--s-8) var(--s-4); border: 2px dashed var(--edge); border-radius: var(--r-lg); background: var(--side); cursor: pointer; color: var(--ink-2); }
.drop.over { border-color: var(--brand); background: var(--brand-soft); }
.drop b { color: var(--ink); }
.drop .icon { width: 24px; height: 24px; color: var(--brand-text); }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--s-2); }
.choice { position: relative; display: grid; gap: 2px; padding: var(--s-3) var(--s-4); border: 1px solid var(--line); border-radius: var(--r-md); cursor: pointer; }
.choice input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.choice b { font-weight: 600; }
.choice span { font-size: var(--t-xs); color: var(--ink-3); }
.choice:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.choice:has(input:focus-visible) { outline: 2px solid var(--ring); outline-offset: 2px; }
.people-pick { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.status-line { display: flex; gap: var(--s-2); align-items: flex-start; font-size: var(--t-sm); padding: var(--s-3) var(--s-4); border-radius: var(--r-md); margin-top: var(--s-3); }
.status-line .icon { margin-top: 3px; }
.status-line.ok { background: var(--ok-soft); color: var(--ok); }
.status-line.bad { background: var(--bad-soft); color: var(--bad); }
.status-line.info { background: var(--fill); color: var(--ink-2); }
.status-line p { margin: 0; }
.toast { position: fixed; left: 50%; bottom: var(--s-6); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--paper); padding: var(--s-2) var(--s-4); border-radius: var(--r-md); font-size: var(--t-sm); box-shadow: var(--pop-shadow); opacity: 0; pointer-events: none; transition: opacity 150ms ease; }
.toast.show { opacity: 1; }
.save-state { font-variant-numeric: tabular-nums; }
.save-state.warn { color: var(--warn); }
.welcome { display: grid; gap: var(--s-4); max-width: 560px; }
.welcome h2 { margin: 0; font-size: var(--t-lg); }
.welcome p { margin: 0; color: var(--ink-2); }
.steps-list { margin: 0; padding-left: var(--s-5); color: var(--ink-2); }
.steps-list li { margin-bottom: var(--s-2); }
.help h2 { font-size: var(--t-lg); margin: var(--s-10) 0 var(--s-3); }
.help p, .help li { color: var(--ink-2); max-width: var(--measure); }
.help ol { padding-left: var(--s-5); }
.help li { margin-bottom: var(--s-2); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--s-2) var(--s-4); font-size: var(--t-sm); margin: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; color: var(--ink); }
.temas { display: grid; gap: 0; }
.tema { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--s-1) var(--s-4); padding: var(--s-3) 0; border-top: 1px solid var(--line); }
.tema:first-child { border-top: 0; padding-top: 0; }
.tema .time-btn { grid-row: span 2; }
.tema b { font-weight: 600; color: var(--ink); }
.tema p { margin: 0; color: var(--ink-2); max-width: var(--measure); }
.time-btn { border: 0; background: var(--fill); color: var(--brand-text); border-radius: var(--r-sm); min-height: 28px; padding: 0 var(--s-2); font-size: var(--t-xs); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; align-self: start; }
.related { display: grid; margin-top: var(--s-3); }
.person-row { padding: var(--s-3) 0; border-top: 1px solid var(--line); max-width: var(--measure); color: var(--ink-2); }
.r-sec > h2 + .person-row { border-top: 0; padding-top: 0; }
.transcript summary { cursor: pointer; font-size: var(--t-lg); font-weight: 600; list-style: none; display: flex; align-items: center; gap: var(--s-2); min-height: 44px; }
.transcript summary::-webkit-details-marker { display: none; }
.transcript summary .icon { transition: transform 150ms ease; }
.transcript[open] summary .icon { transform: rotate(90deg); }
.transcript summary small { font-weight: 400; color: var(--ink-3); font-size: var(--t-sm); }
.turns { display: grid; margin-top: var(--s-3); }
.turn { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--s-3); padding: var(--s-2) 0; border-top: 1px solid var(--line); scroll-margin-top: var(--s-12); }
.turn.flash { background: var(--brand-soft); }
.turn-who { font-size: var(--t-xs); font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: var(--s-2); margin-bottom: 2px; }
.turn p { margin: 0; color: var(--ink-2); font-size: var(--t-sm); }
.task-closed { font-size: var(--t-xs); color: var(--ok); }
.minute { font-size: var(--t-xs); }
.prompt-preview { max-height: 220px; }
.r-sec + .r-sec { margin-top: var(--s-10); }
.r-sec > h2 { font-size: var(--t-lg); font-weight: 600; margin: 0 0 var(--s-4); scroll-margin-top: var(--s-4); }
@media (max-width: 60rem) { .form-grid { grid-template-columns: minmax(0, 1fr); } .step { padding: var(--s-4); } }
@media print { .transcript:not([open]), .r-actions, .actions { display: none !important; } }

/* ═══════════ Projetos (PMO) ═══════════ */
.chart .grid-l { stroke: var(--line); }
.chart .diag { stroke: var(--edge); stroke-dasharray: 4 4; }
.chart .mta-line { fill: none; stroke: var(--c); stroke-width: 2; stroke-linejoin: round; }
.chart .mta-dot { fill: var(--paper); stroke: var(--c); stroke-width: 2; }
.chart .mta-label { fill: var(--ink-2); font: 600 11px var(--font-ui); }
.chart .line-scope { fill: none; stroke: var(--ink-3); stroke-width: 2; stroke-dasharray: 5 4; }
.chart .bar-new { fill: var(--coral); opacity: .55; }
.rag-strip { display: flex; gap: 3px; }
.rag-cell { flex: 1; min-width: 8px; height: 28px; border-radius: 4px; background: var(--fill); }
.rag-cell.ok { background: var(--ok); } .rag-cell.warn { background: var(--warn); } .rag-cell.bad { background: var(--bad); }
.rag-axis { display: flex; justify-content: space-between; font-size: var(--t-xs); color: var(--ink-3); margin-top: var(--s-1); font-variant-numeric: tabular-nums; }
blockquote.quote { margin: var(--s-3) 0 0; padding-left: var(--s-4); border-left: 2px solid var(--brand-line); color: var(--ink-2); font-style: italic; }

<script type="application/json" id="exemplos">[{"id":"exemplo-kickoff-aurora","exemplo":true,"data":"2026-10-08","tipo":"Ata","fonte":"vtt","aproximado":false,"eu":"Eu","oradores":["Eu","Ana Costa","Rui Lopes","Marta Sousa"],"falas":[[3.0,60.82,0,"Bom dia a todos. Então, tipo, a ideia hoje é basicamente arrancarmos com o Projeto Aurora. Pronto, acho que todos já viram o documento, mas se calhar vale a pena eu fazer um resumo rápido, ok? O cliente quer migrar o portal de reservas para a nova plataforma até ao final do primeiro trimestre, e, tipo, isso implica rever a integração com pagamentos, o motor de pesquisa e, basicamente, toda a parte de notificações. Pronto, eu acho que o maior risco é mesmo a integração com pagamentos, porque, tipo, o fornecedor atual tem uma API antiga e, ou seja, não sabemos bem o que vamos encontrar. Portanto, se calhar a primeira coisa é mapear isso. E depois, tipo, temos de pensar na equipa, porque, pronto, a Marta só entra a cem por cento em novembro e o Rui está dividido com o outro cliente, ok? Basicamente era isto.",56.14],[61.57,75.69,1,"Obrigada. Uma pergunta: o prazo do primeiro trimestre é fechado ou há margem? Porque se a integração de pagamentos for tão complicada como parece, eu não me comprometia já com março.",13.82],[76.25,85.87,0,"Pronto, tipo, acho que há alguma margem, mas, ou seja, o cliente foi bastante claro de que quer ver alguma coisa em produção em março.",9.36],[86.91,103.53,2,"Podemos fazer em duas fases. Primeiro o portal com o pagamento antigo, através de um adaptador, e depois a migração do pagamento numa segunda fase. Assim temos produção em março sem depender do fornecedor.",16.26],[105.06,116.8,3,"Concordo com o Rui. E eu consigo preparar o mapeamento da API de pagamentos até dia vinte de outubro, se tiver acesso à documentação esta semana.",11.53],[117.52,128.37,0,"Ok, então, tipo, fica decidido: vamos em duas fases. Fase um em março com adaptador, fase dois a seguir. Eu peço a documentação ao cliente hoje ainda.",10.55],[129.31,138.02,1,"E quem fica com o plano de testes? Da última vez isso ficou para o fim e correu mal.",8.51],[139.49,148.34,2,"Fico eu com o plano de testes, entrego a primeira versão até trinta e um de outubro.",8.68],[149.55,157.47,0,"Perfeito. Pronto, e eu acho que, se calhar, devíamos marcar um ponto de situação semanal, às quintas. Pode ser?",7.62],[158.35,165.09,1,"Pode. Eu trato do convite e da página no Confluence com as decisões de hoje.",6.69],[165.63,172.74,3,"Só uma nota: o orçamento de infraestrutura ainda não está aprovado. Isso pode atrasar o ambiente de testes.",6.87],[173.62,182.84,0,"Tens razão. Pronto, isso fica como ponto em aberto, eu falo com o Pedro das finanças. Basicamente, obrigada a todos, falamos na quinta.",9.15]],"notas":"","conteudo":{"titulo":"Kickoff do Projeto Aurora","etiquetas":["projeto aurora","migração","pagamentos","planeamento"],"resumo":"Arranque da migração do portal de reservas do cliente para a nova plataforma. Para não depender da API antiga de pagamentos, a equipa decidiu avançar em duas fases: produção em março com um adaptador, migração dos pagamentos a seguir.","contexto":"","temas":[{"titulo":"Objetivo e riscos do projeto","inicio":"00:03","fim":"01:36","resumo":"Migrar o portal até ao fim do primeiro trimestre; o maior risco é a API antiga de pagamentos."},{"titulo":"Prazo e estratégia em duas fases","inicio":"01:36","fim":"02:16","resumo":"O Rui propõe produção em março com um adaptador e a migração dos pagamentos numa segunda fase."},{"titulo":"Testes, acompanhamento e orçamento","inicio":"02:16","fim":"03:00","resumo":"Plano de testes com o Rui, ponto semanal às quintas e orçamento de infraestrutura por aprovar."}],"seccoes":[{"tipo":"decisoes","titulo":"Decisões Tomadas","itens":["Projeto em duas fases: fase 1 em produção em março com adaptador para o pagamento atual; fase 2 migra o pagamento.","Ponto de situação semanal às quintas-feiras."]},{"tipo":"riscos","titulo":"Pontos em Aberto","itens":["Orçamento de infraestrutura por aprovar; pode atrasar o ambiente de testes.","Disponibilidade da equipa: Marta só a 100% em novembro; Rui partilhado com outro cliente."]}],"tarefas":[{"acao":"Pedir ao cliente a documentação da API de pagamentos","responsavel":"Eu","prazo":"2026-10-08","minuto":"02:00","feito":false},{"acao":"Mapear a API de pagamentos","responsavel":"Marta Sousa","prazo":"2026-10-20","minuto":"01:52","feito":false},{"acao":"Entregar a primeira versão do plano de testes","responsavel":"Rui Lopes","prazo":"2026-10-31","minuto":"02:16","feito":false},{"acao":"Enviar convite semanal e criar página de decisões no Confluence","responsavel":"Ana Costa","prazo":null,"minuto":"02:30","feito":false},{"acao":"Falar com o Pedro (finanças) sobre o orçamento de infraestrutura","responsavel":"Eu","prazo":"2026-11-15","minuto":"02:45","feito":false}],"tarefas_concluidas":[],"radar":{"correu_bem":["Fechaste a decisão de forma explícita: \"fica decidido: vamos em duas fases\".","Reconheceste o ponto da Marta sobre o orçamento e assumiste o seguimento."],"a_melhorar":["A abertura foi um monólogo de mais de um minuto, com \"tipo\" e \"pronto\" a cada frase. Experimenta: \"Objetivo de hoje: decidir como arrancamos o Aurora. Três pontos: prazo, risco dos pagamentos, equipa.\"","\"Acho que\" e \"se calhar\" enfraqueceram a proposta do ponto semanal. Diz antes: \"Proponho um ponto semanal às quintas.\""],"experimenta":"Abre com o objetivo numa frase e faz uma pergunta à equipa antes de dares a tua opinião."}}},{"id":"exemplo-orcamento-q4","exemplo":true,"data":"2026-10-22","tipo":"Dados","fonte":"vtt","aproximado":false,"eu":"Eu","oradores":["Pedro Alves","Eu","Sofia Nunes"],"falas":[[3.0,18.45,0,"Vamos aos números do quarto trimestre. A execução orçamental está nos oitenta e sete por cento, com um desvio de mais doze por cento na infraestrutura cloud face ao previsto.",15.03],[20.17,28.2,1,"Doze por cento é bastante. Sabemos o que explica o desvio? É o ambiente do Projeto Aurora ou já vinha de trás?",7.93],[29.19,44.87,0,"Cerca de metade é o Aurora: são dezoito mil euros em ambientes de teste que não estavam no orçamento original. O resto são licenças que renovaram com aumento de sete por cento.",15.41],[46.5,55.35,2,"Nas licenças conseguimos renegociar. O contrato tem cláusula de revisão em janeiro e temos três propostas alternativas abaixo do preço atual.",8.67],[55.93,60.92,1,"Ótimo. Qual é a poupança estimada se avançarmos com a melhor proposta?",4.98],[62.51,69.71,2,"Cerca de vinte e quatro mil euros por ano, ou seja, uns quinze por cento a menos.",7.05],[70.84,81.05,1,"Então proponho isto: aprovamos o reforço de dezoito mil para o Aurora, porque é um projeto faturável, e compensamos com a renegociação das licenças. Faz sentido para vocês?",10.05],[81.41,89.01,0,"Faz. Mas preciso disso por escrito para levar à comissão executiva até dia cinco de novembro.",7.53],[90.42,98.15,1,"Eu preparo a nota com os números até dia quatro. Sofia, consegues mandar-me a comparação das três propostas até amanhã?",7.65],[99.03,101.98,2,"Consigo. Mando ainda hoje ao fim do dia.",2.96],[103.74,117.38,0,"Último ponto: a taxa de utilização da equipa está em setenta e oito por cento, abaixo do objetivo de oitenta e cinco. Novembro deve recuperar com o Aurora.",13.4],[118.79,124.83,1,"Vamos acompanhar isso. Que indicador queres ver na próxima revisão, utilização por pessoa ou por projeto?",5.98],[125.49,129.02,0,"Por projeto, com a margem ao lado.",3.53],[130.01,133.38,1,"Combinado. Obrigada a ambos, isto foi muito claro.",3.37]],"notas":"","conteudo":{"titulo":"Revisão do Orçamento Q4","etiquetas":["orçamento","finanças","cloud","licenças","utilização","projeto aurora"],"resumo":"A execução do Q4 está nos 87%, com um desvio de +12% na cloud: metade vem dos ambientes do Aurora, o resto da renovação de licenças. Proposta: aprovar o reforço do Aurora (faturável) e compensá-lo renegociando as licenças em janeiro.","contexto":"O orçamento de infraestrutura tinha ficado em aberto no kickoff do Projeto Aurora; esta revisão quantifica o impacto.","temas":[{"titulo":"Execução e desvio na cloud","inicio":"00:00","fim":"00:40","resumo":"87% de execução; +12% na cloud, metade explicada pelos ambientes do Aurora."},{"titulo":"Renegociação de licenças","inicio":"00:40","fim":"01:25","resumo":"Três propostas alternativas; poupança estimada de 24 mil euros por ano."},{"titulo":"Utilização da equipa","inicio":"01:25","fim":"02:10","resumo":"78% de utilização face a um objetivo de 85%; deve recuperar em novembro."}],"seccoes":[{"tipo":"tabela","titulo":"Métricas e Valores","colunas":["Métrica / Item","Valor / Número","Contexto"],"linhas":[["Execução orçamental Q4","87%","Pedro, até à data"],["Desvio infraestrutura cloud","+12%","Face ao previsto"],["Ambientes de teste Aurora","18 000 €","Fora do orçamento original"],["Aumento das licenças","+7%","Renovação automática"],["Poupança com renegociação","24 000 €/ano","Sofia; cerca de −15%, melhor de 3 propostas"],["Utilização da equipa","78%","Objetivo: 85%"]]},{"tipo":"lista","titulo":"Tendências e Anomalias","itens":["A renegociação das licenças (24 k€/ano) cobre o reforço do Aurora (18 k€).","A utilização está 7 pontos abaixo do objetivo; deve recuperar em novembro com o Aurora."]},{"tipo":"lista","titulo":"Perguntas por Responder","itens":["Qual a margem por projeto depois do reforço do Aurora?"]}],"tarefas":[{"acao":"Enviar a comparação das 3 propostas de licenças","responsavel":"Sofia Nunes","prazo":"2026-10-22","minuto":"01:20","feito":true},{"acao":"Preparar a nota para a comissão executiva com os números","responsavel":"Eu","prazo":"2026-11-04","minuto":"01:10","feito":false},{"acao":"Trazer a utilização por projeto, com a margem, para a próxima revisão","responsavel":"Pedro Alves","prazo":null,"minuto":"01:55","feito":false}],"tarefas_concluidas":[],"radar":{"correu_bem":["Seis perguntas diretas e concretas (\"Qual é a poupança estimada…?\") puseram os outros a trazer os números.","Fizeste uma proposta clara e pediste validação: \"Faz sentido para vocês?\""],"a_melhorar":["Ritmo ligeiramente acelerado nos números. Uma pausa curta depois de cada valor ajuda quem está a anotar."],"experimenta":"No fim, repete as decisões e os prazos em voz alta (30 segundos)."}}},{"id":"exemplo-negociacao-fornecedor","exemplo":true,"data":"2026-11-04","tipo":"Intenção","fonte":"vtt","aproximado":false,"eu":"Eu","oradores":["Eu","Pedro Alves","Ana Costa"],"falas":[[3.0,14.02,0,"Obrigada por estarem aqui. O objetivo de hoje é fecharmos o calendário de acesso à API de pagamentos para o Projeto Aurora. O que vos preocupa mais neste momento?",10.64],[14.96,26.37,1,"Do nosso lado, a preocupação é o volume de pedidos no ambiente de testes. A última integração que abrimos gerou muitos incidentes.",11.15],[27.9,36.68,0,"Percebo. Se limitarmos o ambiente de testes a mil pedidos por dia e vos enviarmos o plano de testes antes, isso resolve?",8.55],[37.59,42.57,1,"Ajuda bastante. Mas, sinceramente, também temos pouca gente disponível em dezembro.",4.98],[43.26,52.24,2,"Isso preocupa-me. Se o acesso só abrir em janeiro, a fase dois fica comprometida e o cliente não vai gostar.",8.76],[53.83,62.18,0,"Vamos separar as coisas. Pedro, o que precisarias para abrir o acesso ainda em novembro, mesmo que com suporte limitado?",8.06],[62.86,75.55,1,"Precisava que a vossa equipa assumisse o primeiro nível de suporte durante os testes. Assim só escalavam para nós o que fosse mesmo da API.",12.32],[76.81,81.41,2,"Conseguimos fazer isso, o Rui já conhece bem a documentação.",4.61],[82.58,97.77,0,"Então a proposta fica: acesso em novembro, limite de mil pedidos por dia, nós fazemos o primeiro nível de suporte e enviamos o plano de testes até dia doze. Pedro, posso contar com a confirmação até sexta?",14.53],[99.49,106.6,1,"Tenho de validar com o meu diretor, mas em princípio sim. Confirmo até sexta-feira.",6.96],[107.34,109.75,2,"E se o diretor não aprovar?",2.41],[111.22,122.21,0,"Aí escalamos para o patrocinador do cliente, mas acredito que não vai ser preciso. Pedro, há mais alguma coisa que te deixe desconfortável com este plano?",10.61],[123.31,128.4,1,"Não, assim parece-me equilibrado. Obrigado por terem ouvido a nossa parte.",5.09],[129.92,132.7,0,"Obrigada eu. Resumo por email ainda hoje.",2.77]],"notas":"","conteudo":{"titulo":"Negociação de acesso à API de pagamentos","etiquetas":["projeto aurora","fornecedor","pagamentos","negociação","api"],"resumo":"Negociação com o fornecedor de pagamentos para antecipar o acesso à API. Proposta em cima da mesa: acesso em novembro com um limite de 1000 pedidos/dia e a nossa equipa a fazer o suporte de 1.º nível. O Pedro confirma até sexta, depois de validar com o diretor.","contexto":"Dá seguimento ao risco identificado no kickoff do Aurora (API antiga de pagamentos) e à fase 2 decidida nessa reunião.","temas":[{"titulo":"Preocupações do fornecedor","inicio":"00:00","fim":"00:35","resumo":"Volume de pedidos no ambiente de testes e pouca disponibilidade em dezembro."},{"titulo":"Proposta de acesso em novembro","inicio":"00:35","fim":"01:30","resumo":"Limite de 1000 pedidos por dia e suporte de 1.º nível do nosso lado."},{"titulo":"Confirmação e plano B","inicio":"01:30","fim":"02:10","resumo":"O Pedro valida com o diretor até sexta; a escalada ao patrocinador fica como último recurso."}],"seccoes":[{"tipo":"texto","titulo":"Clima e Tom da Reunião","texto":"Começou defensivo e acabou colaborativo. A mudança deu-se quando as preocupações do fornecedor foram tratadas uma a uma, em vez de se discutir só o prazo."},{"tipo":"pessoas","titulo":"Intenções por Participante","itens":[{"quem":"Pedro Alves","texto":"proteger a equipa dele de incidentes e de carga em dezembro.","citacao":"a última integração que abrimos gerou muitos incidentes"},{"quem":"Ana Costa","texto":"proteger o prazo da fase 2 perante o cliente.","citacao":"a fase dois fica comprometida"}]},{"tipo":"decisoes","titulo":"Decisões Tomadas","itens":["Proposta: acesso em novembro, máximo de 1000 pedidos/dia no ambiente de testes, suporte de 1.º nível do nosso lado."]},{"tipo":"riscos","titulo":"Pontos de Bloqueio","itens":["Pouca disponibilidade do fornecedor em dezembro.","O \"em princípio sim\" do Pedro depende do diretor dele: é um compromisso condicional."]},{"tipo":"lista","titulo":"Sugestões de Resolução","itens":["Mandar o plano de testes antes do dia 12 para facilitar a aprovação do lado deles.","Preparar a escalada para o patrocinador do cliente, para usar só se não houver resposta na sexta."]}],"tarefas":[{"acao":"Enviar o resumo da reunião por email","responsavel":"Eu","prazo":"2026-11-04","minuto":"02:05","feito":false},{"acao":"Confirmar o acesso depois de validar com o diretor","responsavel":"Pedro Alves","prazo":"2026-11-06","minuto":"01:40","feito":false},{"acao":"Enviar o plano de testes ao fornecedor","responsavel":"Rui Lopes","prazo":"2026-11-12","minuto":"01:30","feito":false}],"tarefas_concluidas":[],"radar":{"correu_bem":["Abriste com o objetivo e uma pergunta aberta: \"O que vos preocupa mais neste momento?\"","Separaste os problemas (\"Vamos separar as coisas\") e transformaste uma objeção numa condição negociável.","Sem bordões em toda a reunião, uma diferença clara em relação ao kickoff."],"a_melhorar":["A preocupação da Ana sobre janeiro ficou sem resposta direta. Reconhece-a antes de avançar: \"Ana, é exatamente por isso que queremos novembro.\""],"experimenta":"Quando receberes um \"em princípio sim\", define logo o que acontece se a resposta for não."}}}]</script>

const BORDOES = ['tipo', 'pronto', 'prontos', 'portanto', 'basicamente', 'literalmente', 'ok', 'okay', 'pá', 'digamos', 'ou seja', 'quer dizer', 'sei lá', 'olha', 'no fundo', 'efetivamente', 'em termos de', 'de certa forma', 'hum', 'hmm', 'ahn', 'eh', 'uhm', ['não é', 'não é(?=\\s*[?,])'], ['né', 'né(?![\\p{L}\\p{N}])']];

function extractJSON(text) {
  let t = String(text || '').trim().replace(/^﻿/, '').replace(/```(?:json)?/gi, '');

   Um projeto é declarado pela pessoa (nome, descrição, palavras-chave, pessoas). Cada reunião pode

/* Linha do tempo: aplica os blocos pmo das reuniões, por ordem de data */
function projectTimeline(p, list) {

  const snaps = [];

    const pmo = m.c.pmo;

      if (!it.codigo) continue;
      const map = maps[kind], prev = map.get(it.codigo);

      for (const [k, v] of Object.entries(it)) if (k !== 'codigo' && v !== '' && v !== null && v !== undefined) e[k] = v;
      if (!e[label]) e[label] = it[label] || e[label] || it.codigo;
      e.mentions++; e.last = m.date; e.lastId = m.id;
      e.hist.push({ date: m.date, id: m.id, ...it });
      map.set(it.codigo, e);

      rag: pmo?.estado?.rag || null,

      novos: (pmo?.backlog || []).filter(b => b.codigo && maps.backlog.get(b.codigo)?.firstId === m.id).length,
      riscos: ['alta', 'media', 'baixa'].map(g => [...maps.riscos.values()].filter(r => r.gravidade === g && ['aberto', 'materializado'].includes(r.estado)).length),
      decisoes: [...maps.decisoes_pendentes.values()].filter(d => d.estado === 'pendente').length,
      satisfacao: pmo?.satisfacao?.nota ?? null, adocao: pmo?.adocao?.percentagem ?? null,
      marcos: Object.fromEntries([...maps.marcos.values()].map(x => [x.codigo, x.data_prevista])),

function assignCodes(p, pmo, list, excludeId) {
  if (!pmo) return;
  const tl = projectTimeline(p, (list || meetings).filter(m => m.id !== excludeId));
  for (const [kind, prefix, label] of PMO_KINDS) {
    const map = tl.maps[kind];
    let next = Math.max(0, ...[...map.keys()].map(c => +c.slice(1) || 0)) + 1;
    const used = new Set(map.keys());
    for (const it of pmo[kind] || []) {
      if (it.codigo && !it.codigo.startsWith(prefix)) it.codigo = null;
      if (it.codigo && (used.has(it.codigo) || !map.size)) { used.add(it.codigo); continue; }
      const match = [...map.values()].find(e => similar(e[label] || '', it[label] || ''));
      if (match) it.codigo = match.codigo;
      else if (!it.codigo || used.has(it.codigo)) { while (used.has(prefix + next)) next++; it.codigo = prefix + next++; }
      used.add(it.codigo);
    }
  }
}

  if (chronic.length) alerts.push({ s: 'warn', t: plural(chronic.length, 'dor crónica', 'dores crónicas'), d: `Itens falados em 3 ou mais reuniões sem serem resolvidos: ${LF.format(chronic.slice(0, 3).map(b => `“${b.titulo}”`))}.` });
  if (reopened.length) alerts.push({ s: 'warn', t: plural(reopened.length, 'item reaberto', 'itens reabertos'), d: `Dados como entregues e depois voltaram a ser problema: ${LF.format(reopened.slice(0, 3).map(b => `“${b.titulo}”`))}.` });
  decisoes.filter(d => d.idade >= 3).forEach(d => alerts.push({ s: 'warn', t: 'Decisão arrastada', d: `“${d.titulo}” está por decidir há ${plural(d.idade, 'reunião', 'reuniões')}.` }));
  const repeated = []; todos.forEach(t => { const g = repeated.find(x => similar(x.text, t.text)); if (g) g.n++; else repeated.push({ text: t.text, n: 1, open: !isDone(t) }); });
  repeated.filter(r => r.n >= 3).forEach(r => alerts.push({ s: 'warn', t: `Ação pedida ${r.n} vezes`, d: `“${r.text}” foi combinada em ${r.n} reuniões diferentes. Ou falta dono, ou falta prazo, ou falta vontade.` }));
  if (zombies.length) alerts.push({ s: 'warn', t: plural(zombies.length, 'ação zombie', 'ações zombie'), d: 'Abertas há 3 ou mais reuniões sem fecho.' });

  if (deliveredRecent !== null && growth > deliveredRecent + 1) alerts.push({ s: 'warn', t: 'O backlog cresce mais depressa do que se entrega', d: `${plural(growth, 'pedido novo', 'pedidos novos')} e ${plural(deliveredRecent, 'entrega', 'entregas')} nas últimas 3 reuniões.` });
  confianca.forEach(c => { const l = c.pts.slice(-2); if (l.length === 2 && l[1].v >= 3 && l[1].v > l[0].v) alerts.push({ s: 'warn', t: `Linguagem hesitante de ${firstName(c.nome)}`, d: `${nf(l[1].v, 1)} hesitações por 100 palavras na última reunião (antes ${nf(l[0].v, 1)}). Costuma antecipar atrasos.` }); });
  const health = !ms.length ? null : alerts.some(a => a.s === 'bad') ? 'bad' : alerts.length ? 'warn' : 'ok';
  const perguntas = [...(last?.pmo?.perguntas_pmo || [])];
  return { tl, ms, snaps, last, rag: ragPmo, marcos, back, open, pushed, reopened, chronic, riscos, riscosAbertos, decisoes, todos, sayDo, overdue, zombies, durTotal, cadence, delivered, sat, ado, confianca, alerts, health, perguntas, temPmo: snaps.some(s => s.pmo) };
}

/* Sugestões de projetos: pessoas ou temas recorrentes fora de projetos */
function projectSuggestions() {
  const free = meetings.filter(m => !m.exemplo && !m.rec.projeto);
  const people = new Map(), tags = new Map();
  free.forEach(m => { m.people.filter(p => !isMe(p)).forEach(p => { const k = [...people.keys()].find(x => samePerson(x, p)) || p; people.set(k, (people.get(k) || 0) + 1); }); m.tags.forEach(t => tags.set(norm(t), [(tags.get(norm(t))?.[0] || t), (tags.get(norm(t))?.[1] || 0) + 1])); });
  const taken = projects().flatMap(p => [...(p.pessoas || []), ...(p.palavras || []), p.nome]);
  const out = [];
  [...tags.values()].filter(([t, n]) => n >= 3 && !taken.some(x => similar(x, t))).sort((a, b) => b[1] - a[1]).slice(0, 2).forEach(([t, n]) => out.push({ nome: cap(t), palavras: [t], pessoas: [], n, motivo: `${plural(n, 'reunião', 'reuniões')} com o tema “${t}”` }));
  [...people.entries()].filter(([p, n]) => n >= 3 && !taken.some(x => samePerson(x, p))).sort((a, b) => b[1] - a[1]).slice(0, 2).forEach(([p, n]) => out.push({ nome: `Reuniões com ${displayName(p)}`, palavras: [], pessoas: [p], n, motivo: `${plural(n, 'reunião', 'reuniões')} com ${displayName(p)}` }));
  return out.slice(0, 3);
}
function candidateMeetings(p) {
  return meetings.filter(m => !m.exemplo).map(m => {
    let score = 0;
    if ((p.palavras || []).some(k => k && m.search.includes(norm(k)))) score += 2;
    if (norm(m.title).includes(norm(p.nome))) score += 2;
    if ((p.pessoas || []).some(x => m.people.some(y => samePerson(x, y)))) score += 1;
    return { m, score };
  }).filter(o => o.score > 0 || o.m.rec.projeto === p.id).sort((a, b) => (b.m.date || '').localeCompare(a.m.date || ''));
}

function applyHistory(p, raw) {
  const o = extractJSON(raw);

  let n = 0;
  const ms = meetingsOf(p);
  for (const r of list) {
    const m = ms.find(x => x.id === r.id) || ms.find(x => r.data && x.date === r.data);
    if (!m) continue;
    const pmo = normalizePMO(r.pmo || r); if (!pmo) continue;
    pmo.projeto = p.nome;
    m.rec.conteudo.pmo = pmo; m.c.pmo = pmo; n++;

  // Códigos que faltem, por ordem cronológica
  for (const m of ms) if (m.c.pmo) assignCodes(p, m.c.pmo, meetings.filter(x => (x.date || '') < (m.date || '') || x === m).filter(x => x !== m), m.id);

}

function lineChart(pts, opt = {}) {
  const W = 340, H = 130, P = { l: 30, r: 10, t: 10, b: 22 };
  const vals = pts.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (opt.band) { if (opt.band[0] != null) lo = Math.min(lo, opt.band[0]); if (opt.band[1] != null) hi = Math.max(hi, opt.band[1]); }
  if (opt.ref != null) { lo = Math.min(lo, opt.ref); hi = Math.max(hi, opt.ref); }
  if (opt.min != null) lo = opt.min; if (opt.max != null) hi = opt.max;
  if (hi === lo) { hi += 1; lo = Math.max(0, lo - 1); }
  if (opt.min == null && opt.max == null) { const span = hi - lo; hi += span * .1; lo = Math.max(0, lo - span * .1); }
  const x = i => P.l + (pts.length === 1 ? (W - P.l - P.r) / 2 : i * (W - P.l - P.r) / (pts.length - 1));
  const y = v => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  let band = '';
  if (opt.band) { const b0 = opt.band[0] ?? lo, b1 = opt.band[1] ?? hi; band = `<rect class="band" x="${P.l}" width="${W - P.l - P.r}" y="${y(Math.min(hi, b1)).toFixed(1)}" height="${Math.max(0, y(Math.max(lo, b0)) - y(Math.min(hi, b1))).toFixed(1)}" rx="3"/>`; }
  const ref = opt.ref != null ? `<line class="ref" x1="${P.l}" x2="${W - P.r}" y1="${y(opt.ref).toFixed(1)}" y2="${y(opt.ref).toFixed(1)}"/>` : '';
  const f = v => nf(v, v < 10 ? 1 : 0);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || '')}: ${esc(pts.map(p => `${fmtDate(p.date, 'short')}, ${opt.fmt(p.v)}`).join('; '))}">
    ${band}${ref}
    <text class="ax" x="${P.l - 6}" y="${y(hi) + 4}" text-anchor="end">${f(hi)}</text><text class="ax" x="${P.l - 6}" y="${y(lo) + 4}" text-anchor="end">${f(lo)}</text>
    <path class="line" d="${path}"/>
    ${pts.map((p, i) => `<circle class="${i === pts.length - 1 ? 'last' : ''}" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5"><title>${esc(p.title)}, ${fmtDate(p.date, 'short')}: ${opt.fmt(p.v)}</title></circle>`).join('')}
    <text class="ax" x="${x(0)}" y="${H - 6}" text-anchor="${pts.length === 1 ? 'middle' : 'start'}">${fmtDate(pts[0].date, 'short')}</text>
    ${pts.length > 1 ? `<text class="ax" x="${x(pts.length - 1)}" y="${H - 6}" text-anchor="end">${fmtDate(pts[pts.length - 1].date, 'short')}</text>` : ''}
  </svg>`;
}

const dnum = iso => toDate(iso).getTime();
function mtaChart(M) {
  const series = M.marcos.map((x, i) => ({ x, c: `var(--sp${(i % 6) + 1})`, pts: x.hist.filter(h => h.data_prevista && h.date).map(h => [dnum(h.date), dnum(h.data_prevista), h]) })).filter(s => s.pts.length);
  if (!series.length) return '<p class="muted">Ainda não há marcos com datas. Aparecem quando se fala de datas de entrega nas reuniões.</p>';
  const W = 720, H = 300, P = { l: 70, r: 70, t: 14, b: 34 };

  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x1 - x0 < 7 * 864e5) { x0 -= 3 * 864e5; x1 += 4 * 864e5; }
  let y0 = Math.min(...all, x0), y1 = Math.max(...all, x1); const pad = (y1 - y0) * .08 || 864e5 * 3; y0 -= pad; y1 += pad;
  const X = t => P.l + (t - x0) / (x1 - x0) * (W - P.l - P.r), Y = t => P.t + (1 - (t - y0) / (y1 - y0)) * (H - P.t - P.b);
  const iso = t => localISO(new Date(t));
  const yt = Array.from({ length: 5 }, (_, i) => y0 + (y1 - y0) * i / 4), xt = M.snaps.length <= 6 ? M.snaps.map(s => dnum(s.date)) : Array.from({ length: 5 }, (_, i) => x0 + (x1 - x0) * i / 4);
  const d0 = Math.max(x0, y0), d1 = Math.min(x1, y1);
  return `<svg class="chart mta" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tendência de marcos: ${esc(series.map(s => `${s.x.nome}, de ${fmtDate(s.x.primeira, 'short')} para ${fmtDate(s.x.atual, 'short')}`).join('; '))}">
    ${yt.map(t => `<line class="grid-l" x1="${P.l}" x2="${W - P.r}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text class="ax" x="${P.l - 8}" y="${Y(t) + 3}" text-anchor="end">${fmtDate(iso(t), 'short')}</text>`).join('')}
    ${xt.map(t => `<text class="ax" x="${X(t).toFixed(1)}" y="${H - 10}" text-anchor="middle">${fmtDate(iso(t), 'short')}</text>`).join('')}

      ${s.pts.map(p => `<circle class="mta-dot" cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="3.5"><title>${esc(s.x.nome)}: na reunião de ${fmtDate(p[2].date, 'short')}, previsto para ${fmtDate(p[2].data_prevista, 'short')}</title></circle>`).join('')}
      <text class="mta-label" x="${(X(s.pts[s.pts.length - 1][0]) + 8).toFixed(1)}" y="${(Y(s.pts[s.pts.length - 1][1]) + 4).toFixed(1)}">${esc(s.x.codigo)}</text></g>`).join('')}
  </svg>
  <div class="legend" style="margin-top:var(--s-2)">${series.map(s => `<span><span class="key" style="--c:${s.c}"></span>${esc(s.x.codigo)} ${esc(s.x.nome)}${s.x.replans ? `, ${plural(s.x.replans, 'mudança', 'mudanças')} de data` : ''}${s.x.concluido ? ', concluído' : ''}</span>`).join('')}</div>`;

function burnupChart(M) {

function projectReportText(p) {
  const M = projectMetrics(p), L = [];
  const nx = M.marcos.find(x => !x.concluido);
  L.push(`${p.nome.toUpperCase()}: PONTO DE SITUAÇÃO`, `${fmtDate(TODAY)}; ${plural(M.ms.length, 'reunião analisada', 'reuniões analisadas')}`);
  L.push('', `SAÚDE (PMO): ${M.health ? HEALTH_LABEL[M.health] : 'sem dados'}${M.rag?.rag ? `. Estado reportado: ${RAG_LABEL[M.rag.rag]}${M.rag.explicito ? '' : ' (inferido)'}${M.rag.razao ? '. ' + M.rag.razao : ''}` : ''}`);
  if (M.marcos.length) { L.push('', 'MARCOS'); M.marcos.forEach(x => L.push(`- ${x.nome}: ${x.concluido ? 'concluído' : fmtDate(x.atual)}${x.slip > 0 ? ` (+${plural(x.slip, 'dia', 'dias')}, ${plural(x.replans, 'mudança', 'mudanças')} de data)` : ''}`)); }
  L.push('', `BACKLOG: ${M.delivered} entregues de ${M.back.length}; ${M.open.length} em aberto${M.pushed.length ? `; ${plural(M.pushed.length, 'adiado', 'adiados')} para versão posterior` : ''}.`);
  if (M.alerts.length) { L.push('', 'ALERTAS'); M.alerts.forEach(a => L.push(`- ${a.t}. ${a.d}`)); }
  if (M.riscosAbertos.length) { L.push('', 'RISCOS EM ABERTO'); M.riscosAbertos.forEach(r => L.push(`- ${r.titulo} (${r.gravidade})${r.mitigacao ? '. Mitigação: ' + r.mitigacao : ''}`)); }
  if (M.decisoes.length) { L.push('', 'DECISÕES POR TOMAR'); M.decisoes.forEach(d => L.push(`- ${d.titulo} (há ${d.idade} reuniões)`)); }
  const qs = projectDerivedQuestions(M); if (qs.length) { L.push('', 'PRÓXIMAS PERGUNTAS'); qs.forEach(q => L.push(`- ${q}`)); }
  return L.join('\n');
}

function seek(sec) {
  const m = byId.get(current?.id); if (!m) return;
  const t0 = m.data?.t0 || 0;
  let i = m.turns.findIndex(t => t.end - t0 >= sec); if (i < 0) i = m.turns.length - 1;
  const d = $('#transcript'); if (!d) return; d.open = true;
  const el = $('#turn-' + i); if (!el) return;
  el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600);
}
function ataText(m) {
  const c = m.c, L = [];
  L.push(m.title.toUpperCase(), `${fmtDate(m.date)}${m.dur ? ', ' + fmtDur(m.dur) : ''}`);
  if (m.people.length) L.push(`Participantes: ${LF.format(m.people.map(personLabel))}`);
  if (c.resumo) L.push('', 'RESUMO', c.resumo);
  for (const s of c.seccoes || []) {
    L.push('', s.titulo.toUpperCase());
    if (s.tipo === 'texto') L.push(s.texto);
    else if (s.tipo === 'tabela') { L.push(s.colunas.join(' | ')); s.linhas.forEach(r => L.push(r.join(' | '))); }
    else if (s.tipo === 'citacoes' || s.tipo === 'pessoas') s.itens.forEach(i => L.push(`- ${i.quem ? displayName(i.quem) + ': ' : ''}${i.texto}${i.citacao ? ` ("${i.citacao}")` : ''}`));
    else s.itens.forEach(i => L.push(`- ${i}`));
  }
  if (m.todos.length) { L.push('', 'PLANO DE AÇÃO'); m.todos.forEach(t => L.push(`- ${t.text} (${t.owner ? (mineTodo(t) && OWNER() ? displayName(OWNER()) : displayName(t.owner)) : 'sem responsável'}${t.due ? ', até ' + fmtDate(t.due) : ''})`)); }
  return L.join('\n');
}
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove();
    toast(ok ? okMsg : 'Não foi possível copiar automaticamente. Seleciona o texto e usa Ctrl+C.'); return ok;

}

function viewTasks() {

function viewPeople() {

function viewEvolution() {
  const pts = meetings.filter(meOf).slice().reverse().map(m => ({ m, me: meOf(m), n: m.data.oradores.length }));
  if (!pts.length) return `<div class="page"><h1 tabindex="-1">Evolução</h1>
    <div class="empty">${icon('mic')}<h2>Ainda sem dados sobre ti</h2><p>Ao adicionar uma reunião, escolhe quem és na lista de participantes. A partir daí, cada reunião alimenta esta vista.</p></div></div>`;
  const nRecent = Math.min(3, Math.max(1, Math.floor(pts.length / 2))), recent = pts.slice(-nRecent), prev = pts.slice(0, -nRecent);
  const avg = (arr, k) => arr.reduce((s, p) => s + p.me[k], 0) / arr.length;
  const latest = pts[pts.length - 1], fairLast = 100 / Math.max(2, latest.n);
  const cards = METRICS.map(mt => {
    const series = pts.map(p => ({ v: p.me[mt.k], date: p.m.date, title: p.m.title }));
    const last = series[series.length - 1].v;
    let trend = '';
    if (prev.length) {
      const a = avg(recent, mt.k), b = avg(prev, mt.k), diff = a - b, rel = b ? Math.abs(diff / b) : (diff ? 1 : 0);
      if (rel < .05) trend = '<span class="trend flat">Estável</span>';
      else {
        let good;
        if (mt.better === 'low') good = diff < 0; else if (mt.better === 'high') good = diff > 0;
        else { const mid = mt.k === 'pct' ? fairLast : (mt.band[0] + mt.band[1]) / 2; good = Math.abs(a - mid) < Math.abs(b - mid); }
        trend = `<span class="trend ${good ? 'up' : 'down'}">${diff > 0 ? 'Subiu' : 'Desceu'} ${nf(rel * 100)}%, ${good ? 'a melhorar' : 'a piorar'}</span>`;
      }
    }
    const s = status(mt.k, last, { n: latest.n });
    return `<section class="panel chart-panel" aria-label="${esc(mt.l)}">
      <div class="panel-head" style="margin-bottom:var(--s-2)"><h2>${mt.l}</h2><span class="badge ${s}">${STATUS_LABEL[s]}</span></div>
      <div class="big">${mt.fmt(last)}</div>${trend}
      <p class="stat-h" style="margin:var(--s-1) 0 0">${esc(mt.k === 'pct' ? `Partilha justa na última reunião: ${pctf(fairLast)}` : mt.help)}</p>
      ${lineChart(series, { band: mt.band, ref: mt.k === 'pct' ? fairLast : null, fmt: mt.fmt, label: mt.l })}
    </section>`;
  }).join('');
  const agg = {}; pts.forEach(p => Object.entries(p.me.bordoes || {}).forEach(([w, c]) => { agg[w] = (agg[w] || 0) + c; }));
  const topB = Object.entries(agg).sort((a, b) => b[1] - a[1]).slice(0, 8), maxB = topB[0]?.[1] || 1;
  const tips = meetings.filter(m => m.tip).slice(0, 5);
  return `<div class="page wide">
    <div class="page-head"><div><h1 tabindex="-1">Evolução</h1><p class="page-sub">A tua comunicação em ${plural(pts.length, 'reunião analisada', 'reuniões analisadas')}. A faixa verde é a zona recomendada.</p></div></div>
    <div class="stack">
      <div class="cols-2">
        <section class="panel" aria-labelledby="ev-sum"><div class="panel-head"><h2 id="ev-sum">${recent.length === 1 ? 'Na última reunião' : `Média das últimas ${recent.length}`}</h2></div><ul class="verdicts">
          ${METRICS.map(mt => { const v = avg(recent, mt.k), s = status(mt.k, v, { n: latest.n }); return `<li><span>${mt.l}: <b class="tabular">${mt.fmt(v)}</b></span><span class="badge ${s}">${STATUS_LABEL[s]}</span></li>`; }).join('')}</ul></section>
        <section class="panel" aria-labelledby="ev-bord"><div class="panel-head"><h2 id="ev-bord">Os teus bordões mais frequentes</h2><p>${plural(pts.length, 'reunião', 'reuniões')}</p></div>
          ${topB.length ? topB.map(([w, c]) => `<div class="hbar"><span>“${esc(w)}”</span><span class="hbar-track" aria-hidden="true"><i style="--p:${(c / maxB).toFixed(3)}"></i></span><span class="tabular" style="text-align:right">${nf(c)}</span></div>`).join('') : '<p class="muted">Nenhum bordão detetado.</p>'}</section>
      </div>
      <div class="cols-3">${cards}</div>
      ${tips.length ? `<section class="panel" aria-labelledby="ev-tips"><div class="panel-head"><h2 id="ev-tips">Dicas recentes do Radar</h2></div><div class="rows">${tips.map(m => `<a class="row-link" href="${meetingHref(m)}"><div class="row-main"><div class="row-title">${esc(curly(m.tip))}</div><div class="row-sub"><span>${esc(m.title)}</span><span>${fmtDate(m.date, 'short')}</span></div></div></a>`).join('')}</div></section>` : ''}
    </div>
  </div>`;
}

async function loadTranscriptFile(file) {

    const r = await readTranscript(file);

    acceptCues(r, file.name);

}
function acceptCues(r, name) {

  const names = [...new Set(r.cues.map(c => c.speaker))];

  W.alias = known ?? (names.length === 1 ? names[0] : null);
