<script type="application/json" id="exemplos">[{"id":"exemplo-kickoff-aurora","exemplo":true,"data":"2026-10-08","tipo":"Ata","fonte":"vtt","aproximado":false,"eu":"Eu","oradores":["Eu","Ana Costa","Rui Lopes","Marta Sousa"],"falas":[[3.0,60.82,0,"Bom dia a todos. Então, tipo, a ideia hoje é basicamente arrancarmos com o Projeto Aurora. Pronto, acho que todos já viram o documento, mas se calhar vale a pena eu fazer um resumo rápido, ok? O cliente quer migrar o portal de reservas para a nova plataforma até ao final do primeiro trimestre, e, tipo, isso implica rever a integração com pagamentos, o motor de pesquisa e, basicamente, toda a parte de notificações. Pronto, eu acho que o maior risco é mesmo a integração com pagamentos, porque, tipo, o fornecedor atual tem uma API antiga e, ou seja, não sabemos bem o que vamos encontrar. Portanto, se calhar a primeira coisa é mapear isso. E depois, tipo, temos de pensar na equipa, porque, pronto, a Marta só entra a cem por cento em novembro e o Rui está dividido com o outro cliente, ok? Basicamente era isto.",56.14],[61.57,75.69,1,"Obrigada. Uma pergunta: o prazo do primeiro trimestre é fechado ou há margem? Porque se a integração de pagamentos for tão complicada como parece, eu não me comprometia já com março.",13.82],[76.25,85.87,0,"Pronto, tipo, acho que há alguma margem, mas, ou seja, o cliente foi bastante claro de que quer ver alguma coisa em produção em março.",9.36],[86.91,103.53,2,"Podemos fazer em duas fases. Primeiro o portal com o pagamento antigo, através de um adaptador, e depois a migração do pagamento numa segunda fase. Assim temos produção em março sem depender do fornecedor.",16.26],[105.06,116.8,3,"Concordo com o Rui. E eu consigo preparar o mapeamento da API de pagamentos até dia vinte de outubro, se tiver acesso à documentação esta semana.",11.53],[117.52,128.37,0,"Ok, então, tipo, fica decidido: vamos em duas fases. Fase um em março com adaptador, fase dois a seguir. Eu peço a documentação ao cliente hoje ainda.",10.55],[129.31,138.02,1,"E quem fica com o plano de testes? Da última vez isso ficou para o fim e correu mal.",8.51],[139.49,148.34,2,"Fico eu com o plano de testes, entrego a primeira versão até trinta e um de outubro.",8.68],[149.55,157.47,0,"Perfeito. Pronto, e eu acho que, se calhar, devíamos marcar um ponto de situação semanal, às quintas. Pode ser?",7.62],[158.35,165.09,1,"Pode. Eu trato do convite e da página no Confluence com as decisões de hoje.",6.69],[165.63,172.74,3,"Só uma nota: o orçamento de infraestrutura ainda não está aprovado. Isso pode atrasar o ambiente de testes.",6.87],[173.62,182.84,0,"Tens razão. Pronto, isso fica como ponto em aberto, eu falo com o Pedro das finanças. Basicamente, obrigada a todos, falamos na quinta.",9.15]],"notas":"","conteudo":{"titulo":"Kickoff do Projeto Aurora","etiquetas":["projeto aurora","migração","pagamentos","planeamento"],"resumo":"Arranque da migração do portal de reservas do cliente para a nova plataforma. Para não depender da API antiga de pagamentos, a equipa decidiu avançar em duas fases: produção em março com um adaptador, migração dos pagamentos a seguir.","contexto":"","temas":[{"titulo":"Objetivo e riscos do projeto","inicio":"00:03","fim":"01:36","resumo":"Migrar o portal até ao fim do primeiro trimestre; o maior risco é a API antiga de pagamentos."},{"titulo":"Prazo e estratégia em duas fases","inicio":"01:36","fim":"02:16","resumo":"O Rui propõe produção em março com um adaptador e a migração dos pagamentos numa segunda fase."},{"titulo":"Testes, acompanhamento e orçamento","inicio":"02:16","fim":"03:00","resumo":"Plano de testes com o Rui, ponto semanal às quintas e orçamento de infraestrutura por aprovar."}],"seccoes":[{"tipo":"decisoes","titulo":"Decisões Tomadas","itens":["Projeto em duas fases: fase 1 em produção em março com adaptador para o pagamento atual; fase 2 migra o pagamento.","Ponto de situação semanal às quintas-feiras."]},{"tipo":"riscos","titulo":"Pontos em Aberto","itens":["Orçamento de infraestrutura por aprovar; pode atrasar o ambiente de testes.","Disponibilidade da equipa: Marta só a 100% em novembro; Rui partilhado com outro cliente."]}],"tarefas":[{"acao":"Pedir ao cliente a documentação da API de pagamentos","responsavel":"Eu","prazo":"2026-10-08","minuto":"02:00","feito":false},{"acao":"Mapear a API de pagamentos","responsavel":"Marta Sousa","prazo":"2026-10-20","minuto":"01:52","feito":false},{"acao":"Entregar a primeira versão do plano de testes","responsavel":"Rui Lopes","prazo":"2026-10-31","minuto":"02:16","feito":false},{"acao":"Enviar convite semanal e criar página de decisões no Confluence","responsavel":"Ana Costa","prazo":null,"minuto":"02:30","feito":false},{"acao":"Falar com o Pedro (finanças) sobre o orçamento de infraestrutura","responsavel":"Eu","prazo":"2026-11-15","minuto":"02:45","feito":false}],"tarefas_concluidas":[],"radar":{"correu_bem":["Fechaste a decisão de forma explícita: \"fica decidido: vamos em duas fases\".","Reconheceste o ponto da Marta sobre o orçamento e assumiste o seguimento."],"a_melhorar":["A abertura foi um monólogo de mais de um minuto, com \"tipo\" e \"pronto\" a cada frase. Experimenta: \"Objetivo de hoje: decidir como arrancamos o Aurora. Três pontos: prazo, risco dos pagamentos, equipa.\"","\"Acho que\" e \"se calhar\" enfraqueceram a proposta do ponto semanal. Diz antes: \"Proponho um ponto semanal às quintas.\""],"experimenta":"Abre com o objetivo numa frase e faz uma pergunta à equipa antes de dares a tua opinião."}}},{"id":"exemplo-orcamento-q4","exemplo":true,"data":"2026-10-22","tipo":"Dados","fonte":"vtt","aproximado":false,"eu":"Eu","oradores":["Pedro Alves","Eu","Sofia Nunes"],"falas":[[3.0,18.45,0,"Vamos aos números do quarto trimestre. A execução orçamental está nos oitenta e sete por cento, com um desvio de mais doze por cento na infraestrutura cloud face ao previsto.",15.03],[20.17,28.2,1,"Doze por cento é bastante. Sabemos o que explica o desvio? É o ambiente do Projeto Aurora ou já vinha de trás?",7.93],[29.19,44.87,0,"Cerca de metade é o Aurora: são dezoito mil euros em ambientes de teste que não estavam no orçamento original. O resto são licenças que renovaram com aumento de sete por cento.",15.41],[46.5,55.35,2,"Nas licenças conseguimos renegociar. O contrato tem cláusula de revisão em janeiro e temos três propostas alternativas abaixo do preço atual.",8.67],[55.93,60.92,1,"Ótimo. Qual é a poupança estimada se avançarmos com a melhor proposta?",4.98],[62.51,69.71,2,"Cerca de vinte e quatro mil euros por ano, ou seja, uns quinze por cento a menos.",7.05],[70.84,81.05,1,"Então proponho isto: aprovamos o reforço de dezoito mil para o Aurora, porque é um projeto faturável, e compensamos com a renegociação das licenças. Faz sentido para vocês?",10.05],[81.41,89.01,0,"Faz. Mas preciso disso por escrito para levar à comissão executiva até dia cinco de novembro.",7.53],[90.42,98.15,1,"Eu preparo a nota com os números até dia quatro. Sofia, consegues mandar-me a comparação das três propostas até amanhã?",7.65],[99.03,101.98,2,"Consigo. Mando ainda hoje ao fim do dia.",2.96],[103.74,117.38,0,"Último ponto: a taxa de utilização da equipa está em setenta e oito por cento, abaixo do objetivo de oitenta e cinco. Novembro deve recuperar com o Aurora.",13.4],[118.79,124.83,1,"Vamos acompanhar isso. Que indicador queres ver na próxima revisão, utilização por pessoa ou por projeto?",5.98],[125.49,129.02,0,"Por projeto, com a margem ao lado.",3.53],[130.01,133.38,1,"Combinado. Obrigada a ambos, isto foi muito claro.",3.37]],"notas":"","conteudo":{"titulo":"Revisão do Orçamento Q4","etiquetas":["orçamento","finanças","cloud","licenças","utilização","projeto aurora"],"resumo":"A execução do Q4 está nos 87%, com um desvio de +12% na cloud: metade vem dos ambientes do Aurora, o resto da renovação de licenças. Proposta: aprovar o reforço do Aurora (faturável) e compensá-lo renegociando as licenças em janeiro.","contexto":"O orçamento de infraestrutura tinha ficado em aberto no kickoff do Projeto Aurora; esta revisão quantifica o impacto.","temas":[{"titulo":"Execução e desvio na cloud","inicio":"00:00","fim":"00:40","resumo":"87% de execução; +12% na cloud, metade explicada pelos ambientes do Aurora."},{"titulo":"Renegociação de licenças","inicio":"00:40","fim":"01:25","resumo":"Três propostas alternativas; poupança estimada de 24 mil euros por ano."},{"titulo":"Utilização da equipa","inicio":"01:25","fim":"02:10","resumo":"78% de utilização face a um objetivo de 85%; deve recuperar em novembro."}],"seccoes":[{"tipo":"tabela","titulo":"Métricas e Valores","colunas":["Métrica / Item","Valor / Número","Contexto"],"linhas":[["Execução orçamental Q4","87%","Pedro, até à data"],["Desvio infraestrutura cloud","+12%","Face ao previsto"],["Ambientes de teste Aurora","18 000 €","Fora do orçamento original"],["Aumento das licenças","+7%","Renovação automática"],["Poupança com renegociação","24 000 €/ano","Sofia; cerca de −15%, melhor de 3 propostas"],["Utilização da equipa","78%","Objetivo: 85%"]]},{"tipo":"lista","titulo":"Tendências e Anomalias","itens":["A renegociação das licenças (24 k€/ano) cobre o reforço do Aurora (18 k€).","A utilização está 7 pontos abaixo do objetivo; deve recuperar em novembro com o Aurora."]},{"tipo":"lista","titulo":"Perguntas por Responder","itens":["Qual a margem por projeto depois do reforço do Aurora?"]}],"tarefas":[{"acao":"Enviar a comparação das 3 propostas de licenças","responsavel":"Sofia Nunes","prazo":"2026-10-22","minuto":"01:20","feito":true},{"acao":"Preparar a nota para a comissão executiva com os números","responsavel":"Eu","prazo":"2026-11-04","minuto":"01:10","feito":false},{"acao":"Trazer a utilização por projeto, com a margem, para a próxima revisão","responsavel":"Pedro Alves","prazo":null,"minuto":"01:55","feito":false}],"tarefas_concluidas":[],"radar":{"correu_bem":["Seis perguntas diretas e concretas (\"Qual é a poupança estimada…?\") puseram os outros a trazer os números.","Fizeste uma proposta clara e pediste validação: \"Faz sentido para vocês?\""],"a_melhorar":["Ritmo ligeiramente acelerado nos números. Uma pausa curta depois de cada valor ajuda quem está a anotar."],"experimenta":"No fim, repete as decisões e os prazos em voz alta (30 segundos)."}}},{"id":"exemplo-negociacao-fornecedor","exemplo":true,"data":"2026-11-04","tipo":"Intenção","fonte":"vtt","aproximado":false,"eu":"Eu","oradores":["Eu","Pedro Alves","Ana Costa"],"falas":[[3.0,14.02,0,"Obrigada por estarem aqui. O objetivo de hoje é fecharmos o calendário de acesso à API de pagamentos para o Projeto Aurora. O que vos preocupa mais neste momento?",10.64],[14.96,26.37,1,"Do nosso lado, a preocupação é o volume de pedidos no ambiente de testes. A última integração que abrimos gerou muitos incidentes.",11.15],[27.9,36.68,0,"Percebo. Se limitarmos o ambiente de testes a mil pedidos por dia e vos enviarmos o plano de testes antes, isso resolve?",8.55],[37.59,42.57,1,"Ajuda bastante. Mas, sinceramente, também temos pouca gente disponível em dezembro.",4.98],[43.26,52.24,2,"Isso preocupa-me. Se o acesso só abrir em janeiro, a fase dois fica comprometida e o cliente não vai gostar.",8.76],[53.83,62.18,0,"Vamos separar as coisas. Pedro, o que precisarias para abrir o acesso ainda em novembro, mesmo que com suporte limitado?",8.06],[62.86,75.55,1,"Precisava que a vossa equipa assumisse o primeiro nível de suporte durante os testes. Assim só escalavam para nós o que fosse mesmo da API.",12.32],[76.81,81.41,2,"Conseguimos fazer isso, o Rui já conhece bem a documentação.",4.61],[82.58,97.77,0,"Então a proposta fica: acesso em novembro, limite de mil pedidos por dia, nós fazemos o primeiro nível de suporte e enviamos o plano de testes até dia doze. Pedro, posso contar com a confirmação até sexta?",14.53],[99.49,106.6,1,"Tenho de validar com o meu diretor, mas em princípio sim. Confirmo até sexta-feira.",6.96],[107.34,109.75,2,"E se o diretor não aprovar?",2.41],[111.22,122.21,0,"Aí escalamos para o patrocinador do cliente, mas acredito que não vai ser preciso. Pedro, há mais alguma coisa que te deixe desconfortável com este plano?",10.61],[123.31,128.4,1,"Não, assim parece-me equilibrado. Obrigado por terem ouvido a nossa parte.",5.09],[129.92,132.7,0,"Obrigada eu. Resumo por email ainda hoje.",2.77]],"notas":"","conteudo":{"titulo":"Negociação de acesso à API de pagamentos","etiquetas":["projeto aurora","fornecedor","pagamentos","negociação","api"],"resumo":"Negociação com o fornecedor de pagamentos para antecipar o acesso à API. Proposta em cima da mesa: acesso em novembro com um limite de 1000 pedidos/dia e a nossa equipa a fazer o suporte de 1.º nível. O Pedro confirma até sexta, depois de validar com o diretor.","contexto":"Dá seguimento ao risco identificado no kickoff do Aurora (API antiga de pagamentos) e à fase 2 decidida nessa reunião.","temas":[{"titulo":"Preocupações do fornecedor","inicio":"00:00","fim":"00:35","resumo":"Volume de pedidos no ambiente de testes e pouca disponibilidade em dezembro."},{"titulo":"Proposta de acesso em novembro","inicio":"00:35","fim":"01:30","resumo":"Limite de 1000 pedidos por dia e suporte de 1.º nível do nosso lado."},{"titulo":"Confirmação e plano B","inicio":"01:30","fim":"02:10","resumo":"O Pedro valida com o diretor até sexta; a escalada ao patrocinador fica como último recurso."}],"seccoes":[{"tipo":"texto","titulo":"Clima e Tom da Reunião","texto":"Começou defensivo e acabou colaborativo. A mudança deu-se quando as preocupações do fornecedor foram tratadas uma a uma, em vez de se discutir só o prazo."},{"tipo":"pessoas","titulo":"Intenções por Participante","itens":[{"quem":"Pedro Alves","texto":"proteger a equipa dele de incidentes e de carga em dezembro.","citacao":"a última integração que abrimos gerou muitos incidentes"},{"quem":"Ana Costa","texto":"proteger o prazo da fase 2 perante o cliente.","citacao":"a fase dois fica comprometida"}]},{"tipo":"decisoes","titulo":"Decisões Tomadas","itens":["Proposta: acesso em novembro, máximo de 1000 pedidos/dia no ambiente de testes, suporte de 1.º nível do nosso lado."]},{"tipo":"riscos","titulo":"Pontos de Bloqueio","itens":["Pouca disponibilidade do fornecedor em dezembro.","O \"em princípio sim\" do Pedro depende do diretor dele: é um compromisso condicional."]},{"tipo":"lista","titulo":"Sugestões de Resolução","itens":["Mandar o plano de testes antes do dia 12 para facilitar a aprovação do lado deles.","Preparar a escalada para o patrocinador do cliente, para usar só se não houver resposta na sexta."]}],"tarefas":[{"acao":"Enviar o resumo da reunião por email","responsavel":"Eu","prazo":"2026-11-04","minuto":"02:05","feito":false},{"acao":"Confirmar o acesso depois de validar com o diretor","responsavel":"Pedro Alves","prazo":"2026-11-06","minuto":"01:40","feito":false},{"acao":"Enviar o plano de testes ao fornecedor","responsavel":"Rui Lopes","prazo":"2026-11-12","minuto":"01:30","feito":false}],"tarefas_concluidas":[],"radar":{"correu_bem":["Abriste com o objetivo e uma pergunta aberta: \"O que vos preocupa mais neste momento?\"","Separaste os problemas (\"Vamos separar as coisas\") e transformaste uma objeção numa condição negociável.","Sem bordões em toda a reunião, uma diferença clara em relação ao kickoff."],"a_melhorar":["A preocupação da Ana sobre janeiro ficou sem resposta direta. Reconhece-a antes de avançar: \"Ana, é exatamente por isso que queremos novembro.\""],"experimenta":"Quando receberes um \"em princípio sim\", define logo o que acontece se a resposta for não."}}}]</script>

const BORDOES = ['tipo', 'pronto', 'prontos', 'portanto', 'basicamente', 'literalmente', 'ok', 'okay', 'pá', 'digamos', 'ou seja', 'quer dizer', 'sei lá', 'olha', 'no fundo', 'efetivamente', 'em termos de', 'de certa forma', 'hum', 'hmm', 'ahn', 'eh', 'uhm', ['não é', 'não é(?=\\s*[?,])'], ['né', 'né(?![\\p{L}\\p{N}])']];

function extractJSON(text) {
  let t = String(text || '').trim().replace(/^﻿/, '').replace(/```(?:json)?/gi, '');

   Um projeto é declarado pela pessoa (nome, descrição, palavras-chave, pessoas). Cada reunião pode

/* Linha do tempo: aplica os blocos pmo das reuniões, por ordem de data */
function projectTimeline(p, list) {

  const snaps = [];

    const pmo = m.c.pmo;

      if (!it.codigo) continue;
      const map = maps[kind], prev = map.get(it.codigo);

      for (const [k, v] of Object.entries(it)) if (k !== 'codigo' && v !== '' && v !== null && v !== undefined) e[k] = v;
      if (!e[label]) e[label] = it[label] || e[label] || it.codigo;
      e.mentions++; e.last = m.date; e.lastId = m.id;
      e.hist.push({ date: m.date, id: m.id, ...it });
      map.set(it.codigo, e);

      rag: pmo?.estado?.rag || null,

      novos: (pmo?.backlog || []).filter(b => b.codigo && maps.backlog.get(b.codigo)?.firstId === m.id).length,
      riscos: ['alta', 'media', 'baixa'].map(g => [...maps.riscos.values()].filter(r => r.gravidade === g && ['aberto', 'materializado'].includes(r.estado)).length),
      decisoes: [...maps.decisoes_pendentes.values()].filter(d => d.estado === 'pendente').length,
      satisfacao: pmo?.satisfacao?.nota ?? null, adocao: pmo?.adocao?.percentagem ?? null,
      marcos: Object.fromEntries([...maps.marcos.values()].map(x => [x.codigo, x.data_prevista])),

function assignCodes(p, pmo, list, excludeId) {
  if (!pmo) return;
  const tl = projectTimeline(p, (list || meetings).filter(m => m.id !== excludeId));
  for (const [kind, prefix, label] of PMO_KINDS) {
    const map = tl.maps[kind];
    let next = Math.max(0, ...[...map.keys()].map(c => +c.slice(1) || 0)) + 1;
    const used = new Set(map.keys());
    for (const it of pmo[kind] || []) {
      if (it.codigo && !it.codigo.startsWith(prefix)) it.codigo = null;
      if (it.codigo && (used.has(it.codigo) || !map.size)) { used.add(it.codigo); continue; }
      const match = [...map.values()].find(e => similar(e[label] || '', it[label] || ''));
      if (match) it.codigo = match.codigo;
      else if (!it.codigo || used.has(it.codigo)) { while (used.has(prefix + next)) next++; it.codigo = prefix + next++; }
      used.add(it.codigo);
    }
  }
}

  if (chronic.length) alerts.push({ s: 'warn', t: plural(chronic.length, 'dor crónica', 'dores crónicas'), d: `Itens falados em 3 ou mais reuniões sem serem resolvidos: ${LF.format(chronic.slice(0, 3).map(b => `“${b.titulo}”`))}.` });
  if (reopened.length) alerts.push({ s: 'warn', t: plural(reopened.length, 'item reaberto', 'itens reabertos'), d: `Dados como entregues e depois voltaram a ser problema: ${LF.format(reopened.slice(0, 3).map(b => `“${b.titulo}”`))}.` });
  decisoes.filter(d => d.idade >= 3).forEach(d => alerts.push({ s: 'warn', t: 'Decisão arrastada', d: `“${d.titulo}” está por decidir há ${plural(d.idade, 'reunião', 'reuniões')}.` }));
  const repeated = []; todos.forEach(t => { const g = repeated.find(x => similar(x.text, t.text)); if (g) g.n++; else repeated.push({ text: t.text, n: 1, open: !isDone(t) }); });
  repeated.filter(r => r.n >= 3).forEach(r => alerts.push({ s: 'warn', t: `Ação pedida ${r.n} vezes`, d: `“${r.text}” foi combinada em ${r.n} reuniões diferentes. Ou falta dono, ou falta prazo, ou falta vontade.` }));
  if (zombies.length) alerts.push({ s: 'warn', t: plural(zombies.length, 'ação zombie', 'ações zombie'), d: 'Abertas há 3 ou mais reuniões sem fecho.' });

  if (deliveredRecent !== null && growth > deliveredRecent + 1) alerts.push({ s: 'warn', t: 'O backlog cresce mais depressa do que se entrega', d: `${plural(growth, 'pedido novo', 'pedidos novos')} e ${plural(deliveredRecent, 'entrega', 'entregas')} nas últimas 3 reuniões.` });
  confianca.forEach(c => { const l = c.pts.slice(-2); if (l.length === 2 && l[1].v >= 3 && l[1].v > l[0].v) alerts.push({ s: 'warn', t: `Linguagem hesitante de ${firstName(c.nome)}`, d: `${nf(l[1].v, 1)} hesitações por 100 palavras na última reunião (antes ${nf(l[0].v, 1)}). Costuma antecipar atrasos.` }); });
  const health = !ms.length ? null : alerts.some(a => a.s === 'bad') ? 'bad' : alerts.length ? 'warn' : 'ok';
  const perguntas = [...(last?.pmo?.perguntas_pmo || [])];
  return { tl, ms, snaps, last, rag: ragPmo, marcos, back, open, pushed, reopened, chronic, riscos, riscosAbertos, decisoes, todos, sayDo, overdue, zombies, durTotal, cadence, delivered, sat, ado, confianca, alerts, health, perguntas, temPmo: snaps.some(s => s.pmo) };
}

/* Sugestões de projetos: pessoas ou temas recorrentes fora de projetos */
function projectSuggestions() {
  const free = meetings.filter(m => !m.exemplo && !m.rec.projeto);
  const people = new Map(), tags = new Map();
  free.forEach(m => { m.people.filter(p => !isMe(p)).forEach(p => { const k = [...people.keys()].find(x => samePerson(x, p)) || p; people.set(k, (people.get(k) || 0) + 1); }); m.tags.forEach(t => tags.set(norm(t), [(tags.get(norm(t))?.[0] || t), (tags.get(norm(t))?.[1] || 0) + 1])); });
  const taken = projects().flatMap(p => [...(p.pessoas || []), ...(p.palavras || []), p.nome]);
  const out = [];
  [...tags.values()].filter(([t, n]) => n >= 3 && !taken.some(x => similar(x, t))).sort((a, b) => b[1] - a[1]).slice(0, 2).forEach(([t, n]) => out.push({ nome: cap(t), palavras: [t], pessoas: [], n, motivo: `${plural(n, 'reunião', 'reuniões')} com o tema “${t}”` }));
  [...people.entries()].filter(([p, n]) => n >= 3 && !taken.some(x => samePerson(x, p))).sort((a, b) => b[1] - a[1]).slice(0, 2).forEach(([p, n]) => out.push({ nome: `Reuniões com ${displayName(p)}`, palavras: [], pessoas: [p], n, motivo: `${plural(n, 'reunião', 'reuniões')} com ${displayName(p)}` }));
  return out.slice(0, 3);
}
function candidateMeetings(p) {
  return meetings.filter(m => !m.exemplo).map(m => {
    let score = 0;
    if ((p.palavras || []).some(k => k && m.search.includes(norm(k)))) score += 2;
    if (norm(m.title).includes(norm(p.nome))) score += 2;
    if ((p.pessoas || []).some(x => m.people.some(y => samePerson(x, y)))) score += 1;
    return { m, score };
  }).filter(o => o.score > 0 || o.m.rec.projeto === p.id).sort((a, b) => (b.m.date || '').localeCompare(a.m.date || ''));
}

- Para cada reunião, o bloco "pmo" com o que mudou NESSA reunião: marcos (e a data prevista nessa altura), itens de backlog (pedidos, melhorias, bugs, dores), riscos, decisões pendentes, satisfação do interlocutor principal, adoção (percentagem do processo já feita com a solução nova, se se souber) e perguntas que um PMO devia ter feito a seguir.

function applyHistory(p, raw) {
  const o = extractJSON(raw);

  let n = 0;
  const ms = meetingsOf(p);
  for (const r of list) {
    const m = ms.find(x => x.id === r.id) || ms.find(x => r.data && x.date === r.data);
    if (!m) continue;
    const pmo = normalizePMO(r.pmo || r); if (!pmo) continue;
    pmo.projeto = p.nome;
    m.rec.conteudo.pmo = pmo; m.c.pmo = pmo; n++;
  }
  // Códigos que faltem, por ordem cronológica
  for (const m of ms) if (m.c.pmo) assignCodes(p, m.c.pmo, meetings.filter(x => (x.date || '') < (m.date || '') || x === m).filter(x => x !== m), m.id);

}

function lineChart(pts, opt = {}) {

  const ref = opt.ref != null ? `<line class="ref" x1="${P.l}" x2="${W - P.r}" y1="${y(opt.ref).toFixed(1)}" y2="${y(opt.ref).toFixed(1)}"/>` : '';

    ${band}${area}${ref}

    <path class="line" d="${path}"/>

    <text class="ax" x="${x(0)}" y="${H - 6}" text-anchor="${pts.length === 1 ? 'middle' : 'start'}">${fmtDate(pts[0].date, 'short')}</text>

function mtaChart(M) {

  const X = t => P.l + (t - x0) / (x1 - x0) * (W - P.l - P.r), Y = t => P.t + (1 - (t - y0) / (y1 - y0)) * (H - P.t - P.b);

function projectReportText(p) {
  const M = projectMetrics(p), L = [];
  const nx = M.marcos.find(x => !x.concluido);
  L.push(`${p.nome.toUpperCase()}: PONTO DE SITUAÇÃO`, `${fmtDate(TODAY)}; ${plural(M.ms.length, 'reunião analisada', 'reuniões analisadas')}`);
  L.push('', `SAÚDE (PMO): ${M.health ? HEALTH_LABEL[M.health] : 'sem dados'}${M.rag?.rag ? `. Estado reportado: ${RAG_LABEL[M.rag.rag]}${M.rag.explicito ? '' : ' (inferido)'}${M.rag.razao ? '. ' + M.rag.razao : ''}` : ''}`);
  if (M.marcos.length) { L.push('', 'MARCOS'); M.marcos.forEach(x => L.push(`- ${x.nome}: ${x.concluido ? 'concluído' : fmtDate(x.atual)}${x.slip > 0 ? ` (+${plural(x.slip, 'dia', 'dias')}, ${plural(x.replans, 'mudança', 'mudanças')} de data)` : ''}`)); }
  L.push('', `BACKLOG: ${M.delivered} entregues de ${M.back.length}; ${M.open.length} em aberto${M.pushed.length ? `; ${plural(M.pushed.length, 'adiado', 'adiados')} para versão posterior` : ''}.`);
  if (M.alerts.length) { L.push('', 'ALERTAS'); M.alerts.forEach(a => L.push(`- ${a.t}. ${a.d}`)); }
  if (M.riscosAbertos.length) { L.push('', 'RISCOS EM ABERTO'); M.riscosAbertos.forEach(r => L.push(`- ${r.titulo} (${r.gravidade})${r.mitigacao ? '. Mitigação: ' + r.mitigacao : ''}`)); }
  if (M.decisoes.length) { L.push('', 'DECISÕES POR TOMAR'); M.decisoes.forEach(d => L.push(`- ${d.titulo} (há ${d.idade} reuniões)`)); }
  const qs = projectDerivedQuestions(M); if (qs.length) { L.push('', 'PRÓXIMAS PERGUNTAS'); qs.forEach(q => L.push(`- ${q}`)); }
  return L.join('\n');
}
function pmoMeetingSection(m) {
  const pmo = m.c.pmo; if (!pmo) return '';

    ...pmo.backlog.map(b => `${b.codigo || ''} ${b.titulo}: ${b.estado}${b.versao ? ', ' + b.versao : ''}`),

function homeSentence(mine, late) {

  const parts = [];
  parts.push(week.length ? `<b>${plural(week.length, 'reunião', 'reuniões')}</b> nos últimos 7 dias${hours >= 60 ? `, <b>${fmtDur(hours)}</b> em conversa` : ''}.` : 'Nenhuma reunião nos últimos 7 dias.');
  if (mine.length) parts.push(`${knowsMe() ? 'Tens' : 'Há'} <b>${plural(mine.length, 'tarefa', 'tarefas')}</b> em aberto${late.length ? `, <b>${plural(late.length, 'atrasada', 'atrasadas')}</b>` : ''}.`);
  else parts.push('Sem tarefas em aberto.');
  const hot = projects().map(p => ({ p, M: projectMetrics(p) })).filter(x => x.M.health === 'bad' || x.M.health === 'warn');
  if (hot.length) parts.push(hot.length === 1 ? `O projeto <b>${esc(hot[0].p.nome)}</b> ${hot[0].M.health === 'bad' ? 'está crítico' : 'pede atenção'}.` : `<b>${plural(hot.length, 'projeto pede', 'projetos pedem')}</b> atenção.`);
  return parts.join(' ');
}

function seek(sec) {
  const m = byId.get(current?.id); if (!m) return;
  const t0 = m.data?.t0 || 0;
  let i = m.turns.findIndex(t => t.end - t0 >= sec); if (i < 0) i = m.turns.length - 1;
  const d = $('#transcript'); if (!d) return; d.open = true;
  const el = $('#turn-' + i); if (!el) return;
  el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600);
}
function ataText(m) {
  const c = m.c, L = [];
  L.push(m.title.toUpperCase(), `${fmtDate(m.date)}${m.dur ? ', ' + fmtDur(m.dur) : ''}`);
  if (m.people.length) L.push(`Participantes: ${LF.format(m.people.map(personLabel))}`);
  if (c.resumo) L.push('', 'RESUMO', c.resumo);
  for (const s of c.seccoes || []) {
    L.push('', s.titulo.toUpperCase());
    if (s.tipo === 'texto') L.push(s.texto);
    else if (s.tipo === 'tabela') { L.push(s.colunas.join(' | ')); s.linhas.forEach(r => L.push(r.join(' | '))); }
    else if (s.tipo === 'citacoes' || s.tipo === 'pessoas') s.itens.forEach(i => L.push(`- ${i.quem ? displayName(i.quem) + ': ' : ''}${i.texto}${i.citacao ? ` ("${i.citacao}")` : ''}`));
    else s.itens.forEach(i => L.push(`- ${i}`));
  }
  if (m.todos.length) { L.push('', 'PLANO DE AÇÃO'); m.todos.forEach(t => L.push(`- ${t.text} (${t.owner ? (mineTodo(t) && OWNER() ? displayName(OWNER()) : displayName(t.owner)) : 'sem responsável'}${t.due ? ', até ' + fmtDate(t.due) : ''})`)); }
  return L.join('\n');
}
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove();
    toast(ok ? okMsg : 'Não foi possível copiar automaticamente. Seleciona o texto e usa Ctrl+C.'); return ok;
  }
}

function viewEvolution() {
  const pts = meetings.filter(meOf).slice().reverse().map(m => ({ m, me: meOf(m), n: m.data.oradores.length }));
  if (!pts.length) return `<div class="page"><h1 tabindex="-1">Evolução</h1>
    <div class="empty">${icon('mic')}<h2>Ainda sem dados sobre ti</h2><p>Ao adicionar uma reunião, escolhe quem és na lista de participantes. A partir daí, cada reunião alimenta esta vista.</p></div></div>`;
  const nRecent = Math.min(3, Math.max(1, Math.floor(pts.length / 2))), recent = pts.slice(-nRecent), prev = pts.slice(0, -nRecent);
  const avg = (arr, k) => arr.reduce((s, p) => s + p.me[k], 0) / arr.length;
  const latest = pts[pts.length - 1], fairLast = 100 / Math.max(2, latest.n);
  const cards = METRICS.map(mt => {
    const series = pts.map(p => ({ v: p.me[mt.k], date: p.m.date, title: p.m.title }));
    const last = series[series.length - 1].v;
    let trend = '';
    if (prev.length) {
      const a = avg(recent, mt.k), b = avg(prev, mt.k), diff = a - b, rel = b ? Math.abs(diff / b) : (diff ? 1 : 0);
      if (rel < .05) trend = '<span class="trend flat">Estável</span>';
      else {
        let good;
        if (mt.better === 'low') good = diff < 0; else if (mt.better === 'high') good = diff > 0;
        else { const mid = mt.k === 'pct' ? fairLast : (mt.band[0] + mt.band[1]) / 2; good = Math.abs(a - mid) < Math.abs(b - mid); }
        trend = `<span class="trend ${good ? 'up' : 'down'}">${diff > 0 ? 'Subiu' : 'Desceu'} ${nf(rel * 100)}%, ${good ? 'a melhorar' : 'a piorar'}</span>`;
      }
    }
    const s = status(mt.k, last, { n: latest.n });
    return `<section class="panel chart-panel" aria-label="${esc(mt.l)}">
      <div class="panel-head" style="margin-bottom:var(--s-2)"><h2>${mt.l}</h2><span class="badge ${s}">${STATUS_LABEL[s]}</span></div>
      <div class="big">${mt.fmt(last)}</div>${trend}
      <p class="stat-h" style="margin:var(--s-1) 0 0">${esc(mt.k === 'pct' ? `Partilha justa na última reunião: ${pctf(fairLast)}` : mt.help)}</p>
      ${lineChart(series, { band: mt.band, ref: mt.k === 'pct' ? fairLast : null, fmt: mt.fmt, label: mt.l })}
    </section>`;
  }).join('');
  const agg = {}; pts.forEach(p => Object.entries(p.me.bordoes || {}).forEach(([w, c]) => { agg[w] = (agg[w] || 0) + c; }));
  const topB = Object.entries(agg).sort((a, b) => b[1] - a[1]).slice(0, 8), maxB = topB[0]?.[1] || 1;
  const tips = meetings.filter(m => m.tip).slice(0, 5);
  return `<div class="page wide">
    <div class="page-head"><div><h1 tabindex="-1">Evolução</h1><p class="page-sub">A tua comunicação em ${plural(pts.length, 'reunião analisada', 'reuniões analisadas')}. A faixa verde é a zona recomendada.</p></div></div>
    <div class="stack">
      <div class="cols-2">
        <section class="panel" aria-labelledby="ev-sum"><div class="panel-head"><h2 id="ev-sum">${recent.length === 1 ? 'Na última reunião' : `Média das últimas ${recent.length}`}</h2></div><ul class="verdicts">
          ${METRICS.map(mt => { const v = avg(recent, mt.k), s = status(mt.k, v, { n: latest.n }); return `<li><span>${mt.l}: <b class="tabular">${mt.fmt(v)}</b></span><span class="badge ${s}">${STATUS_LABEL[s]}</span></li>`; }).join('')}</ul></section>
        <section class="panel" aria-labelledby="ev-bord"><div class="panel-head"><h2 id="ev-bord">Os teus bordões mais frequentes</h2><p>${plural(pts.length, 'reunião', 'reuniões')}</p></div>
          ${topB.length ? topB.map(([w, c]) => `<div class="hbar"><span>“${esc(w)}”</span><span class="hbar-track" aria-hidden="true"><i style="--p:${(c / maxB).toFixed(3)}"></i></span><span class="tabular" style="text-align:right">${nf(c)}</span></div>`).join('') : '<p class="muted">Nenhum bordão detetado.</p>'}</section>
      </div>
      <div class="cols-3">${cards}</div>
      ${tips.length ? `<section class="panel" aria-labelledby="ev-tips"><div class="panel-head"><h2 id="ev-tips">Dicas recentes do Radar</h2></div><div class="rows">${tips.map(m => `<a class="row-link" href="${meetingHref(m)}"><div class="row-main"><div class="row-title">${esc(curly(m.tip))}</div><div class="row-sub"><span>${esc(m.title)}</span><span>${fmtDate(m.date, 'short')}</span></div></div></a>`).join('')}</div></section>` : ''}
    </div>
  </div>`;
}

async function loadTranscriptFile(file) {

}
function acceptCues(r, name) {

  const names = [...new Set(r.cues.map(c => c.speaker))];
  const known = names.find(n => isMe(n));
  W.alias = known ?? (names.length === 1 ? names[0] : null);

}

function highlightIn(root, w) {
  const re = termRe(w); if (!re || !root) return;
  const nodes = [], walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('script,style,textarea,mark,svg,details:not([open])') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  while (walker.nextNode()) { re.lastIndex = 0; if (re.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode); }
  nodes.forEach(n => { const span = document.createElement('span'); span.innerHTML = markStr(n.nodeValue, re); n.replaceWith(...span.childNodes); });
  const first = root.querySelector('mark'); if (first) requestAnimationFrame(() => first.scrollIntoView({ block: 'center' }));
}

    const g = curItem.closest('[role="group"]');
    // espera um frame: as alturas dos itens só se acertam depois de pintados (content-visibility)
    if (g) requestAnimationFrame(() => requestAnimationFrame(() => {

      for (let i = 0; i < 3; i++) {
        const d = g.getBoundingClientRect().top - L.getBoundingClientRect().top;

}

});
clist.addEventListener('click', e => { const li = e.target.closest('.cmdk-item'); if (li) cmdkRun(+li.dataset.i); });
clist.addEventListener('pointermove', e => { const li = e.target.closest('.cmdk-item'); if (li && +li.dataset.i !== csel) { csel = +li.dataset.i; cmdkMove(0); } });
cmdk.addEventListener('click', e => { if (e.target === cmdk) cmdk.close(); });
$('#cmdk-open').addEventListener('click', openCmdk);

document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); cmdk.open ? cmdk.close() : openCmdk(); return; }
  if (typing || cmdk.open || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); if (window.matchMedia('(max-width: 60rem)').matches) document.body.classList.add('nav-open'); search.focus(); search.select(); }
  if (e.key === 'j' || e.key === 'k') {
    const list = filtered(); if (!list.length) return;
    const i = list.findIndex(m => m.id === current?.id);
    const n = i < 0 ? 0 : Math.max(0, Math.min(list.length - 1, i + (e.key === 'j' ? 1 : -1)));
    go(meetingHref(list[n]));
  }
});
window.addEventListener('beforeunload', e => { if (current?.view === 'nova' && W && W.copied && !W.parsed) { e.preventDefault(); e.returnValue = ''; } });

/* ════════════════ Arranque ════════════════ */
(async () => {
  await loadState();
  if (EXEMPLO_PROJETO) DEMO = { p: { ...EXEMPLO_PROJETO.projeto, id: 'exemplo' }, meetings: EXEMPLO_PROJETO.reunioes.map(r => toMeeting({ ...r, projeto: 'exemplo', exemplo: true })) };
  readUrlState(); applyTheme(); renderBrand(); rebuild(); renderNav(); renderList(); renderSaveState(); route();
  if (dirHandle && dirPerm === 'granted') writeFile(dirHandle, INSTR_FILE, genericInstructions()).catch(() => {});
  scanInbox();
})();
})();
</script>
