/* ═══════════ Tokens ═══════════
   Cores da marca extraídas de natixis.groupebpce.com (CSS oficial), não de memória.
   Neutros com tinta do violeta (h 312). Contrastes verificados em marca/brand-spec.md. */
:root {
  --font-ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;

  --t-xs: 12px; --t-sm: 13px; --t-base: 15px; --t-md: 16px; --t-lg: 18px; --t-xl: 22px; --t-2xl: 27px;
  --lh-tight: 1.2; --lh: 1.55;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px; --s-16: 64px;
  --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 999px;
  --sidebar: 288px; --measure: 68ch; --container: 1120px; --reader: 820px;
  --ease-out: cubic-bezier(.23, 1, .32, 1); --ease-drawer: cubic-bezier(.32, .72, 0, 1);
  --dur-micro: 120ms; --dur-short: 180ms; --dur-drawer: 280ms;

  /* Superfícies e tinta (claro) */
  --paper: #fdfcfe; --side: #f7f4f9; --fill: #f1edf4; --line: #e2dde6; --edge: #968f9b;
  --ink: #1c1521; --ink-2: #433d48; --ink-3: #66616a;
  /* Marca */
  --brand: #581d74; --brand-ink: #fdfcfe; --brand-soft: #f5e9fd; --brand-line: #d1bae1; --brand-text: #581d74;
  --coral: #ff7645;
  /* Estados */
  --ok: #006e30; --ok-soft: #e3f6e6; --warn: #915200; --warn-soft: #fff0d0; --bad: #ba2b28; --bad-soft: #ffe9e5;
  --mark: #ffd0a2; --ring: #581d74; --scrim: rgb(28 21 33 / .4); --shadow: 0 1px 2px rgb(28 21 33 / .05);
  --pop-shadow: 0 16px 48px -12px rgb(28 21 33 / .28);
  /* Oradores: o "eu" é sempre o violeta da marca; os outros, uma paleta própria em OKLCH */
  --sp0: #581d74; --sp1: #e87045; --sp2: #0f9293; --sp3: #ca9d33; --sp4: #4379bc; --sp5: #439458; --sp6: #7f7780;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #100d12; --side: #161218; --fill: #211c24; --line: #2c272f; --edge: #67606c;

  --ok: #76cf8a; --ok-soft: #172c1c; --warn: #e8be62; --warn-soft: #342a13; --bad: #f6857a; --bad-soft: #3e1f1b;

  --pop-shadow: 0 16px 48px -12px rgb(0 0 0 / .6);
  --sp0: #c296dd; --sp1: #ff8a5e; --sp2: #50bfbe; --sp3: #ebbd57; --sp4: #6fa7ee; --sp5: #73c385; --sp6: #a39ba4;
}

/* ═══════════ Base ═══════════ */
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { -webkit-text-size-adjust: 100%; }
@media (pointer: fine) { html { overscroll-behavior: none; } }
body { margin: 0; min-height: 100dvh; background: var(--paper); color: var(--ink); font: var(--t-base)/var(--lh) var(--font-ui); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: var(--r-sm); }
[tabindex="-1"]:focus { outline: none; }
h1, h2, h3 { text-wrap: balance; overflow-wrap: break-word; min-width: 0; }
p, li { text-wrap: pretty; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: var(--s-4); top: var(--s-4); z-index: 50; padding: var(--s-2) var(--s-3); background: var(--brand); color: var(--brand-ink); border-radius: var(--r-md); transform: translateY(-200%); }
.skip:focus { transform: none; }
.icon { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.tabular, .n { font-variant-numeric: tabular-nums; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
.muted { color: var(--ink-3); }

/* ═══════════ Moldura ═══════════ */
.app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); height: 100dvh; }
#sidebar { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#main { overflow-y: auto; min-width: 0; }
.page { max-width: var(--reader); margin: 0 auto; padding: var(--s-10) var(--s-10) var(--s-16); }
.page.wide { max-width: var(--container); }
.topbar, .scrim { display: none; }

/* Marca */
.brand { padding: var(--s-6) var(--s-5) var(--s-4); display: grid; gap: var(--s-3); }
.brand-logo { color: var(--ink); width: 100%; max-width: 212px; }
.brand-logo svg { display: block; width: 100%; height: auto; }
.brand-team { display: grid; gap: 2px; }
.brand-team b { font-size: var(--t-sm); font-weight: 600; color: var(--ink); }
.brand-team span { font-size: var(--t-xs); color: var(--ink-3); }

.cmdk-trigger { margin: 0 var(--s-3) var(--s-2); display: flex; align-items: center; gap: var(--s-2); height: 36px; padding: 0 var(--s-3); border: 1px solid var(--line); border-radius: var(--r-md); background: var(--paper); color: var(--ink-3); text-align: left; }
.cmdk-trigger span { flex: 1; }
.kbd { font: 500 var(--t-xs)/1 var(--font-ui); padding: 3px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; color: var(--ink-3); background: var(--paper); white-space: nowrap; }
.nav { padding: var(--s-1) var(--s-2) var(--s-3); display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; gap: var(--s-3); min-height: 36px; padding: 0 var(--s-3); border-radius: var(--r-md); text-decoration: none; color: var(--ink-2); }
.nav a[aria-current="page"] { background: var(--brand-soft); color: var(--brand-text); font-weight: 600; }
.nav .count { margin-left: auto; font-size: var(--t-xs); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nav .count.late { color: var(--bad); font-weight: 600; }
.list-head { border-top: 1px solid var(--line); padding: var(--s-4) var(--s-3) var(--s-2); display: grid; gap: var(--s-2); }
.list-title { display: flex; justify-content: space-between; align-items: baseline; padding: 0 var(--s-1); font-size: var(--t-sm); font-weight: 600; color: var(--ink-2); }
.list-title output { font-weight: 400; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.field { position: relative; }
.field .icon { position: absolute; left: var(--s-3); top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.input { width: 100%; height: 36px; padding: 0 var(--s-3) 0 36px; border: 1px solid var(--edge); border-radius: var(--r-md); background: var(--paper); font-size: var(--t-sm); outline: none; }
.input:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: var(--s-1); }
.chip { min-height: 28px; padding: 0 var(--s-3); border-radius: var(--r-full); border: 1px solid var(--line); background: transparent; color: var(--ink-2); font-size: var(--t-xs); }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
#list { overflow-y: auto; flex: 1; padding: 0 var(--s-2) var(--s-4); overscroll-behavior: contain; }
.list-label { position: sticky; top: 0; z-index: 1; background: var(--side); padding: var(--s-3) var(--s-3) var(--s-1); font-size: var(--t-xs); font-weight: 600; color: var(--ink-3); }
.list-label::first-letter { text-transform: uppercase; }
.m-item { display: grid; gap: 2px; padding: var(--s-2) var(--s-3); border-radius: var(--r-md); text-decoration: none; content-visibility: auto; contain-intrinsic-size: auto 64px; }
.m-item[aria-current="page"] { background: var(--brand-soft); }
.m-item[aria-current="page"] .m-title { color: var(--brand-text); }
.m-title { font-weight: 500; font-size: var(--t-sm); line-height: 1.35; overflow-wrap: break-word; }
.m-meta { display: flex; align-items: center; gap: var(--s-3); font-size: var(--t-xs); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.m-meta .badge { margin-left: auto; }
.m-snip { font-size: var(--t-xs); color: var(--ink-3); line-height: 1.45; overflow-wrap: break-word; }
.list-empty { padding: var(--s-6) var(--s-3); color: var(--ink-3); text-align: center; font-size: var(--t-sm); }
.side-foot { border-top: 1px solid var(--line); padding: var(--s-2) var(--s-3); display: flex; gap: var(--s-2); align-items: center; font-size: var(--t-xs); color: var(--ink-3); }
.side-foot span { flex: 1; }

/* Peças */
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border: 0; border-radius: var(--r-md); background: transparent; color: var(--ink-3); position: relative; }
.icon-btn::after { content: ""; position: absolute; inset: -4px; }
.btn { display: inline-flex; align-items: center; gap: var(--s-2); min-height: 36px; padding: 0 var(--s-4); border-radius: var(--r-md); border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-weight: 500; font-size: var(--t-sm); text-decoration: none; white-space: nowrap; }
.btn-link { color: var(--brand-text); font-size: var(--t-sm); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--brand-line); white-space: nowrap; }
.btn, .icon-btn, .chip, .seg button, .cmdk-trigger { transition: transform var(--dur-micro) var(--ease-out); }
.btn:active, .icon-btn:active, .chip:active, .seg button:active, .cmdk-trigger:active { transform: scale(.97); }
.badge { display: inline-flex; align-items: center; min-height: 22px; padding: 0 var(--s-2); border-radius: var(--r-sm); background: var(--fill); font-size: var(--t-xs); font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.badge.me { background: var(--brand-soft); color: var(--brand-text); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-5) var(--s-6); min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); margin: 0 0 var(--s-4); }
.panel-head h2 { font-size: var(--t-md); font-weight: 600; margin: 0; }
.panel-head p { margin: 0; font-size: var(--t-xs); color: var(--ink-3); }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--fill); border-radius: var(--r-md); }
.seg button { min-height: 32px; padding: 0 var(--s-3); border: 0; border-radius: var(--r-sm); background: transparent; color: var(--ink-2); font-size: var(--t-sm); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: var(--shadow), 0 0 0 1px var(--line); }
.avatar { width: 28px; height: 28px; border-radius: var(--r-full); display: inline-grid; place-items: center; font-size: var(--t-xs); font-weight: 600; color: var(--paper); background: var(--c, var(--sp6)); flex-shrink: 0; }
.key { width: 10px; height: 10px; border-radius: 3px; background: var(--c, var(--sp6)); display: inline-block; flex-shrink: 0; }
.callout { display: flex; gap: var(--s-3); align-items: flex-start; padding: var(--s-3) var(--s-4); border-radius: var(--r-md); background: var(--brand-soft); color: var(--ink); font-size: var(--t-sm); }
.callout .icon { color: var(--brand-text); margin-top: 3px; }
.callout p { margin: 0; }
.empty { padding: var(--s-12) var(--s-6); color: var(--ink-3); max-width: 46ch; }
.empty h2 { color: var(--ink); font-size: var(--t-lg); margin: 0 0 var(--s-2); }
.empty ol { padding-left: var(--s-5); margin: var(--s-3) 0 0; }
.empty li { margin-bottom: var(--s-1); }
code { font-family: var(--font-mono); font-size: .9em; background: var(--fill); padding: 1px var(--s-1); border-radius: 4px; }

@media (hover: hover) and (pointer: fine) {
  .nav a, .m-item, .chip, .icon-btn, .btn, .cmdk-trigger, .row-link, .tag-btn, .person-btn, .pager a { transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease, transform var(--dur-micro) var(--ease-out); }
  .nav a:hover { background: var(--fill); color: var(--ink); }
  .nav a[aria-current="page"]:hover { background: var(--brand-soft); color: var(--brand-text); }
  .m-item:hover { background: var(--fill); }
  .m-item[aria-current="page"]:hover { background: var(--brand-soft); }
  .chip:hover { border-color: var(--edge); color: var(--ink); }
  .icon-btn:hover { background: var(--fill); color: var(--ink); }
  .btn:hover { background: var(--fill); }
  .btn-link:hover { text-decoration-color: currentColor; }
  .cmdk-trigger:hover { border-color: var(--edge); }
  .row-link:hover .row-title, .person-btn:hover { color: var(--brand-text); }
  .tag-btn:hover { background: var(--brand-soft); color: var(--brand-text); }
  .pager a:hover { border-color: var(--brand-line); }
}

/* ═══════════ Páginas ═══════════ */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s-4); flex-wrap: wrap; margin-bottom: var(--s-8); }
.page h1 { font-size: var(--t-2xl); line-height: var(--lh-tight); letter-spacing: -.015em; font-weight: 650; margin: 0; }
.page-sub { color: var(--ink-3); margin: var(--s-2) 0 0; font-size: var(--t-base); }
.crumbs { display: flex; gap: var(--s-2); align-items: center; font-size: var(--t-sm); color: var(--ink-3); margin-bottom: var(--s-3); }
.crumbs a { text-decoration: none; }
.crumbs a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.stack { display: grid; gap: var(--s-6); }
.cols-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-6); }
.cols-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-4); }

/* Linha de números (sem cartões) */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--paper); }
.stat { padding: var(--s-4) var(--s-5); border-left: 1px solid var(--line); min-width: 0; }
.stat:first-child { border-left: 0; }
.stat-v { font-size: var(--t-xl); font-weight: 650; line-height: var(--lh-tight); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.stat-l { font-size: var(--t-sm); color: var(--ink-2); margin-top: var(--s-1); display: flex; gap: var(--s-2); align-items: center; flex-wrap: wrap; }
.stat-h { font-size: var(--t-xs); color: var(--ink-3); margin-top: 2px; }

/* Listas de linhas */
.rows { display: grid; }
.row-link { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) 0; border-top: 1px solid var(--line); text-decoration: none; min-width: 0; }
.rows > :first-child { border-top: 0; padding-top: 0; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 500; overflow-wrap: break-word; }
.row-sub { font-size: var(--t-xs); color: var(--ink-3); display: flex; gap: var(--s-3); flex-wrap: wrap; font-variant-numeric: tabular-nums; }

/* ═══════════ Assinatura: a fita de quem falou quando ═══════════ */
.ribbon { margin: var(--s-6) 0 var(--s-2); }
.ribbon-track { position: relative; height: 32px; border-radius: var(--r-sm); background: var(--fill); overflow: hidden; }
.ribbon-track svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ribbon rect { fill: var(--c); transition: opacity 150ms ease; }
.ribbon[data-focus="0"] rect:not([data-s="0"]), .ribbon[data-focus="1"] rect:not([data-s="1"]), .ribbon[data-focus="2"] rect:not([data-s="2"]),
.ribbon[data-focus="3"] rect:not([data-s="3"]), .ribbon[data-focus="4"] rect:not([data-s="4"]), .ribbon[data-focus="5"] rect:not([data-s="5"]),
.ribbon[data-focus="6"] rect:not([data-s="6"]) { opacity: .15; }
.ribbon-axis { display: flex; justify-content: space-between; font-size: var(--t-xs); color: var(--ink-3); margin-top: var(--s-1); font-variant-numeric: tabular-nums; }
.ribbon-keys { display: flex; flex-wrap: wrap; gap: var(--s-1) var(--s-2); margin-top: var(--s-3); }
.ribbon-key { display: inline-flex; align-items: center; gap: var(--s-2); min-height: 32px; padding: 0 var(--s-3) 0 var(--s-2); border: 1px solid var(--line); border-radius: var(--r-full); background: var(--paper); font-size: var(--t-sm); color: var(--ink-2); }
.ribbon-key b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.ribbon-key[aria-pressed="true"] { border-color: var(--brand-line); background: var(--brand-soft); }

/* Reunião */
.r-title-row { display: flex; align-items: flex-start; gap: var(--s-4); }
.r-title-row h1 { flex: 1; }
.r-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2) var(--s-5); color: var(--ink-3); font-size: var(--t-sm); margin-top: var(--s-3); }
.r-meta > span { display: inline-flex; align-items: center; gap: var(--s-2); }
.tags { display: flex; flex-wrap: wrap; gap: var(--s-1); margin-top: var(--s-3); }
.tag-btn { border: 0; background: var(--fill); color: var(--ink-2); border-radius: var(--r-sm); min-height: 26px; padding: 0 var(--s-2); font-size: var(--t-xs); }
.r-body > section, .r-block { margin-top: var(--s-10); }
.r-body h2, .r-block > h2 { font-size: var(--t-lg); font-weight: 600; letter-spacing: -.005em; margin: 0 0 var(--s-4); scroll-margin-top: var(--s-4); }
.r-body h3 { font-size: var(--t-base); font-weight: 600; margin: var(--s-5) 0 var(--s-2); display: flex; gap: var(--s-2); align-items: center; }
.r-body h3 .icon { color: var(--brand-text); }
.r-body p { margin: 0 0 var(--s-3); color: var(--ink-2); max-width: var(--measure); }
.r-body ul, .r-body ol { padding-left: var(--s-5); margin: 0 0 var(--s-3); color: var(--ink-2); max-width: var(--measure); }
.r-body li { margin-bottom: var(--s-2); padding-left: 2px; }
.r-body li::marker { color: var(--ink-3); }
.r-body strong { color: var(--ink); font-weight: 600; }
.r-body em { color: var(--ink); }
.lead { font-size: var(--t-md) !important; line-height: 1.65; color: var(--ink) !important; }
.decision, .risk { display: flex; gap: var(--s-3); align-items: flex-start; padding: var(--s-3) 0; border-top: 1px solid var(--line); color: var(--ink-2); max-width: var(--measure); }
.decision:first-of-type, .risk:first-of-type { border-top: 0; padding-top: 0; }
.decision > .icon { color: var(--ok); margin-top: 3px; }
.risk > .icon { color: var(--bad); margin-top: 3px; }
.todo-item { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s-3); padding: var(--s-3) 0; border-top: 1px solid var(--line); }
.todo-item:first-of-type { border-top: 0; padding-top: 0; }
.todo-item label, .task label { display: flex; gap: var(--s-3); align-items: flex-start; cursor: pointer; flex: 1; min-width: 0; color: var(--ink); }
.todo-item input, .task input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--brand); flex-shrink: 0; cursor: pointer; }
.todo-item input:checked + span, .task.done .task-text { text-decoration: line-through; color: var(--ink-3); }
.todo-side, .task-side { display: flex; gap: var(--s-1); flex-shrink: 0; align-items: center; }
.todo-badge { display: none; } /* o caderno desenha o responsável e o prazo a partir de data-owner e data-due */
.r-body blockquote { margin: var(--s-3) 0; padding-left: var(--s-4); border-left: 2px solid var(--brand-line); color: var(--ink-2); max-width: var(--measure); }
.r-body table, .tbl { width: 100%; border-collapse: collapse; font-size: var(--t-sm); }
.r-body th, .r-body td, .tbl th, .tbl td { padding: var(--s-2) var(--s-3); border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.r-body th, .tbl th { font-weight: 500; color: var(--ink-3); font-size: var(--t-xs); white-space: nowrap; }
.r-body td.num, .r-body th.num, .tbl .n { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td { white-space: nowrap; vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.r-body .tag, .radar-metrics { display: none; }
.who { display: inline-flex; align-items: center; gap: var(--s-2); }
.mini { display: inline-block; width: 56px; height: 6px; border-radius: var(--r-full); background: var(--fill); vertical-align: middle; margin-left: var(--s-2); overflow: hidden; }
.mini i { display: block; height: 100%; width: 100%; background: var(--c); border-radius: inherit; transform-origin: left; transform: scaleX(var(--p)); }
.lanes { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s-1) var(--s-3); align-items: center; margin-top: var(--s-5); }
.lane-name { font-size: var(--t-xs); color: var(--ink-2); max-width: 140px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.lane { height: 14px; border-radius: 4px; background: var(--fill); overflow: hidden; }
.lane svg { display: block; width: 100%; height: 100%; }
.lane rect { fill: var(--c); }
.equity { display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-6); font-size: var(--t-sm); color: var(--ink-3); margin-bottom: var(--s-4); }
.equity b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

/* Radar */
.radar { border-top: 2px solid var(--brand); padding-top: var(--s-6); }
.radar-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; margin-bottom: var(--s-6); }
.radar-stat { padding: var(--s-3) var(--s-4); min-width: 0; box-shadow: 1px 0 0 var(--line), 0 1px 0 var(--line); }
.radar-stat .top { display: flex; justify-content: space-between; align-items: center; gap: var(--s-2); font-size: var(--t-xs); color: var(--ink-3); }
.radar-stat .v { font-size: var(--t-lg); font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
.radar-stat .h { font-size: var(--t-xs); color: var(--ink-3); margin-top: 2px; overflow-wrap: break-word; }
.tip { margin-top: var(--s-5); padding: var(--s-4); border-radius: var(--r-md); background: var(--brand-soft); color: var(--ink); max-width: var(--measure); }
.tip strong { color: var(--brand-text) !important; }
.notes textarea { width: 100%; min-height: 128px; resize: vertical; padding: var(--s-3); border: 1px solid var(--edge); border-radius: var(--r-md); background: var(--paper); line-height: var(--lh); outline: none; }
.notes textarea:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.note-status { font-size: var(--t-xs); color: var(--ink-3); min-height: 18px; margin-top: var(--s-1); }
.pager { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s-3); margin-top: var(--s-12); }
.pager a { display: grid; gap: 2px; padding: var(--s-3) var(--s-4); border: 1px solid var(--line); border-radius: var(--r-lg); text-decoration: none; min-width: 0; }
.pager small { color: var(--ink-3); font-size: var(--t-xs); }
.pager span { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pager .next { text-align: right; grid-column: 2; }

/* Tarefas */
.toolbar { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; margin-bottom: var(--s-6); }
.task-group + .task-group { margin-top: var(--s-8); }
.task-group h2 { font-size: var(--t-base); font-weight: 600; margin: 0 0 var(--s-2); display: flex; gap: var(--s-2); align-items: baseline; }
.task-group h2 .count { color: var(--ink-3); font-weight: 400; font-variant-numeric: tabular-nums; }
.task-group h2.late { color: var(--bad); }
.task { display: flex; flex-wrap: wrap; gap: var(--s-1) var(--s-3); align-items: flex-start; padding: var(--s-3) 0; border-top: 1px solid var(--line); }
.task:first-child { border-top: 0; }
.task-text { display: block; overflow-wrap: break-word; }
.task-from { flex-basis: 100%; padding-left: calc(18px + var(--s-3)); font-size: var(--t-xs); color: var(--ink-3); }
.task-from:hover { color: var(--brand-text); }

/* Pessoas */
.person-btn { border: 0; background: none; padding: 0; text-align: left; font-weight: 500; display: inline-flex; align-items: center; gap: var(--s-3); min-height: 36px; }

/* Evolução */
.chart-panel .big { font-size: var(--t-xl); font-weight: 650; font-variant-numeric: tabular-nums; }
.trend { font-size: var(--t-xs); font-weight: 500; }
.trend.up { color: var(--ok); } .trend.down { color: var(--bad); } .trend.flat { color: var(--ink-3); }
.chart { width: 100%; height: auto; display: block; margin-top: var(--s-3); overflow: visible; }
.chart .band { fill: var(--ok-soft); }
.chart .ref { stroke: var(--edge); stroke-dasharray: 3 3; }
.chart .ax { fill: var(--ink-3); font-size: 10px; font-family: var(--font-ui); font-variant-numeric: tabular-nums; }
.chart .line { fill: none; stroke: var(--brand); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart circle { fill: var(--paper); stroke: var(--brand); stroke-width: 2; }
.chart circle.last { fill: var(--brand); }
.hbar { display: grid; grid-template-columns: 120px minmax(0, 1fr) 36px; gap: var(--s-3); align-items: center; font-size: var(--t-sm); margin-bottom: var(--s-2); }
.hbar-track { height: 8px; border-radius: var(--r-full); background: var(--fill); overflow: hidden; }
.hbar-track i { display: block; height: 100%; width: 100%; background: var(--coral); border-radius: inherit; transform-origin: left; transform: scaleX(var(--p)); }
.verdicts { display: grid; gap: var(--s-2); margin: 0; padding: 0; list-style: none; }
.verdicts li { display: flex; gap: var(--s-3); align-items: baseline; justify-content: space-between; }

/* ═══════════ Paleta ⌘K (sem animação: abre-se dezenas de vezes por dia) ═══════════ */
#cmdk { padding: 0; border: 1px solid var(--line); border-radius: var(--r-lg); width: min(640px, calc(100vw - 32px)); max-height: min(520px, calc(100dvh - 120px)); margin: 12dvh auto auto; background: var(--paper); color: var(--ink); box-shadow: var(--pop-shadow); overflow: hidden; }
#cmdk[open] { display: flex; flex-direction: column; }
#cmdk::backdrop { background: var(--scrim); }
.cmdk-input { display: flex; align-items: center; gap: var(--s-3); padding: 0 var(--s-4); border-bottom: 1px solid var(--line); }
.cmdk-input input { flex: 1; height: 52px; border: 0; outline: none; background: transparent; font-size: var(--t-md); }
#cmdk-list { overflow-y: auto; padding: var(--s-2); margin: 0; list-style: none; overscroll-behavior: contain; }
.cmdk-group { padding: var(--s-2) var(--s-2) var(--s-1); font-size: var(--t-xs); font-weight: 600; color: var(--ink-3); }
.cmdk-item { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-2) var(--s-3); border-radius: var(--r-md); cursor: pointer; scroll-margin: var(--s-2); }
.cmdk-item[aria-selected="true"] { background: var(--brand-soft); }
.cmdk-item[aria-selected="true"] .cmdk-title { color: var(--brand-text); }
.cmdk-item .icon { color: var(--ink-3); }
.cmdk-main { flex: 1; min-width: 0; }
.cmdk-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmdk-snip { display: block; font-size: var(--t-xs); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmdk-foot { display: flex; flex-wrap: wrap; gap: var(--s-4); padding: var(--s-2) var(--s-4); border-top: 1px solid var(--line); font-size: var(--t-xs); color: var(--ink-3); }
.cmdk-foot span { display: inline-flex; gap: var(--s-1); align-items: center; }

/* Sem JavaScript: as reuniões continuam legíveis */
#meetings-container { max-width: var(--reader); margin: 0 auto; padding: var(--s-10) var(--s-6); }
.js #meetings-container { display: none; }
.noscript { padding: var(--s-4) var(--s-6); background: var(--warn-soft); color: var(--warn); }

/* ═══════════ Ecrãs pequenos (abaixo de 60rem) ═══════════ */
@media (max-width: 1100px) { .cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 60rem) {
  .app { grid-template-columns: minmax(0, 1fr); }
  #sidebar { position: fixed; inset: 0 auto 0 0; width: min(320px, 86vw); z-index: 30; transform: translateX(-100%); transition: transform 200ms var(--ease-out); box-shadow: var(--pop-shadow); visibility: hidden; }
  body.nav-open #sidebar { transform: none; transition-duration: var(--dur-drawer); transition-timing-function: var(--ease-drawer); visibility: visible; }
  .scrim { display: block; position: fixed; inset: 0; background: var(--scrim); z-index: 25; opacity: 0; pointer-events: none; transition: opacity 200ms ease; }
  body.nav-open .scrim { opacity: 1; pointer-events: auto; }
  .topbar { display: flex; align-items: center; gap: var(--s-2); position: sticky; top: 0; z-index: 10; min-height: 52px; padding: 0 var(--s-2); padding-top: env(safe-area-inset-top); background: var(--paper); border-bottom: 1px solid var(--line); }
  .topbar strong { flex: 1; font-weight: 600; font-size: var(--t-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .page { padding: var(--s-6) var(--s-4) var(--s-12); }
  .page h1 { font-size: var(--t-xl); }
  .cols-2, .cols-3 { grid-template-columns: minmax(0, 1fr); }
  .stat { border-left: 0; border-top: 1px solid var(--line); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(-n+2) { border-top: 0; }
  .stat:nth-child(even) { border-left: 1px solid var(--line); }
  .input, .cmdk-input input, .notes textarea { font-size: var(--t-md); }
  .todo-item, .task { flex-wrap: wrap; }
  .todo-side, .task-side { padding-left: 30px; }
  .pager { grid-template-columns: minmax(0, 1fr); } .pager .next { grid-column: 1; }
}
@media (hover: none) { .chip, .seg button, .tag-btn { min-height: 40px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media print {
  #sidebar, .topbar, .scrim, .r-actions, .notes, .pager, #cmdk, .ribbon-keys { display: none !important; }
  .app { display: block; height: auto; } #main { overflow: visible; } .page { padding: 0; max-width: none; }
  .panel, .radar-stats { break-inside: avoid; }
}

/* ═══════════ v4: caderno autónomo (assistente, armazenamento, transcrição) ═══════════ */
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-lg { min-height: 44px; padding: 0 var(--s-5); font-size: var(--t-base); }
.actions { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; }
.field-label { display: block; font-size: var(--t-sm); font-weight: 600; color: var(--ink); margin-bottom: var(--s-1); }
.field-help { font-size: var(--t-xs); color: var(--ink-3); margin: var(--s-1) 0 0; }
.text-input, .text-area { width: 100%; border: 1px solid var(--edge); border-radius: var(--r-md); background: var(--paper); padding: var(--s-2) var(--s-3); font-size: var(--t-base); outline: none; }
.text-input { min-height: 40px; }
.text-area { min-height: 160px; resize: vertical; font-family: var(--font-mono); font-size: var(--t-sm); line-height: 1.5; }
.text-input:focus-visible, .text-area:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-4); }
.step { border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-5) var(--s-6); background: var(--paper); }
.step + .step { margin-top: var(--s-4); }
.step[aria-disabled="true"] { opacity: .5; }
.step[aria-disabled="true"] :is(button, input, textarea, label) { pointer-events: none; }
.step-head { display: flex; gap: var(--s-3); align-items: baseline; margin-bottom: var(--s-4); }
.step-num { width: 28px; height: 28px; border-radius: var(--r-full); display: inline-grid; place-items: center; background: var(--brand-soft); color: var(--brand-text); font-weight: 650; font-size: var(--t-sm); flex-shrink: 0; }
.step.done .step-num { background: var(--ok-soft); color: var(--ok); }
.step-head h2 { margin: 0; font-size: var(--t-md); font-weight: 600; }
.step-head p { margin: 2px 0 0; font-size: var(--t-sm); color: var(--ink-3); }
.drop { display: grid; place-items: center; gap: var(--s-2); text-align: center; padding: var(--s-8) var(--s-4); border: 2px dashed var(--edge); border-radius: var(--r-lg); background: var(--side); cursor: pointer; color: var(--ink-2); }
.drop.over { border-color: var(--brand); background: var(--brand-soft); }
.drop b { color: var(--ink); }
.drop .icon { width: 24px; height: 24px; color: var(--brand-text); }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--s-2); }
.choice { position: relative; display: grid; gap: 2px; padding: var(--s-3) var(--s-4); border: 1px solid var(--line); border-radius: var(--r-md); cursor: pointer; }
.choice input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.choice b { font-weight: 600; }
.choice span { font-size: var(--t-xs); color: var(--ink-3); }
.choice:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.choice:has(input:focus-visible) { outline: 2px solid var(--ring); outline-offset: 2px; }
.people-pick { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.status-line { display: flex; gap: var(--s-2); align-items: flex-start; font-size: var(--t-sm); padding: var(--s-3) var(--s-4); border-radius: var(--r-md); margin-top: var(--s-3); }
.status-line .icon { margin-top: 3px; }
.status-line.ok { background: var(--ok-soft); color: var(--ok); }
.status-line.bad { background: var(--bad-soft); color: var(--bad); }
.status-line.info { background: var(--fill); color: var(--ink-2); }
.status-line p { margin: 0; }
.toast { position: fixed; left: 50%; bottom: var(--s-6); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--paper); padding: var(--s-2) var(--s-4); border-radius: var(--r-md); font-size: var(--t-sm); box-shadow: var(--pop-shadow); opacity: 0; pointer-events: none; transition: opacity 150ms ease; }
.toast.show { opacity: 1; }
.save-state { font-variant-numeric: tabular-nums; }
.save-state.warn { color: var(--warn); }
.welcome { display: grid; gap: var(--s-4); max-width: 560px; }
.welcome h2 { margin: 0; font-size: var(--t-lg); }
.welcome p { margin: 0; color: var(--ink-2); }
.steps-list { margin: 0; padding-left: var(--s-5); color: var(--ink-2); }
.steps-list li { margin-bottom: var(--s-2); }
.help h2 { font-size: var(--t-lg); margin: var(--s-10) 0 var(--s-3); }
.help p, .help li { color: var(--ink-2); max-width: var(--measure); }
.help ol { padding-left: var(--s-5); }
.help li { margin-bottom: var(--s-2); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--s-2) var(--s-4); font-size: var(--t-sm); margin: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; color: var(--ink); }
.temas { display: grid; gap: 0; }
.tema { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--s-1) var(--s-4); padding: var(--s-3) 0; border-top: 1px solid var(--line); }
.tema:first-child { border-top: 0; padding-top: 0; }
.tema .time-btn { grid-row: span 2; }
.tema b { font-weight: 600; color: var(--ink); }
.tema p { margin: 0; color: var(--ink-2); max-width: var(--measure); }
.time-btn { border: 0; background: var(--fill); color: var(--brand-text); border-radius: var(--r-sm); min-height: 28px; padding: 0 var(--s-2); font-size: var(--t-xs); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; align-self: start; }
.related { display: grid; margin-top: var(--s-3); }
.person-row { padding: var(--s-3) 0; border-top: 1px solid var(--line); max-width: var(--measure); color: var(--ink-2); }
.r-sec > h2 + .person-row { border-top: 0; padding-top: 0; }
.transcript summary { cursor: pointer; font-size: var(--t-lg); font-weight: 600; list-style: none; display: flex; align-items: center; gap: var(--s-2); min-height: 44px; }
.transcript summary::-webkit-details-marker { display: none; }
.transcript summary .icon { transition: transform 150ms ease; }
.transcript[open] summary .icon { transform: rotate(90deg); }
.transcript summary small { font-weight: 400; color: var(--ink-3); font-size: var(--t-sm); }
.turns { display: grid; margin-top: var(--s-3); }
.turn { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--s-3); padding: var(--s-2) 0; border-top: 1px solid var(--line); scroll-margin-top: var(--s-12); }
.turn.flash { background: var(--brand-soft); }
.turn-who { font-size: var(--t-xs); font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: var(--s-2); margin-bottom: 2px; }
.turn p { margin: 0; color: var(--ink-2); font-size: var(--t-sm); }
.task-closed { font-size: var(--t-xs); color: var(--ok); }
.minute { font-size: var(--t-xs); }
.prompt-preview { max-height: 220px; }
.r-sec + .r-sec { margin-top: var(--s-10); }
.r-sec > h2 { font-size: var(--t-lg); font-weight: 600; margin: 0 0 var(--s-4); scroll-margin-top: var(--s-4); }
@media (max-width: 60rem) { .form-grid { grid-template-columns: minmax(0, 1fr); } .step { padding: var(--s-4); } }
@media print { .transcript:not([open]), .r-actions, .actions { display: none !important; } }

/* ═══════════ Projetos (PMO) ═══════════ */
.chart .grid-l { stroke: var(--line); }
.chart .diag { stroke: var(--edge); stroke-dasharray: 4 4; }
.chart .mta-line { fill: none; stroke: var(--c); stroke-width: 2; stroke-linejoin: round; }
.chart .mta-dot { fill: var(--paper); stroke: var(--c); stroke-width: 2; }
.chart .mta-label { fill: var(--ink-2); font: 600 11px var(--font-ui); }
.chart .line-scope { fill: none; stroke: var(--ink-3); stroke-width: 2; stroke-dasharray: 5 4; }
.chart .bar-new { fill: var(--coral); opacity: .55; }
.rag-strip { display: flex; gap: 3px; }
.rag-cell { flex: 1; min-width: 8px; height: 28px; border-radius: 4px; background: var(--fill); }
.rag-cell.ok { background: var(--ok); } .rag-cell.warn { background: var(--warn); } .rag-cell.bad { background: var(--bad); }
.rag-axis { display: flex; justify-content: space-between; font-size: var(--t-xs); color: var(--ink-3); margin-top: var(--s-1); font-variant-numeric: tabular-nums; }
blockquote.quote { margin: var(--s-3) 0 0; padding-left: var(--s-4); border-left: 2px solid var(--brand-line); color: var(--ink-2); font-style: italic; }
.proj-pick { display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap; margin-top: var(--s-3); }
details.panel > summary { list-style: none; }
details.panel > summary::-webkit-details-marker { display: none; }
.verdicts b { font-weight: 600; }
@media (max-width: 60rem) { .rag-cell { min-width: 4px; } }
.status-line.warn { background: var(--warn-soft); color: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: var(--s-1) var(--s-5); font-size: var(--t-sm); color: var(--ink-2); }
.legend > span { display: inline-flex; align-items: center; gap: var(--s-2); }
.panel-head h2 { flex-shrink: 0; max-width: 100%; }
@media (max-width: 60rem) { .panel-head { flex-direction: column; align-items: flex-start; gap: var(--s-1); } }

/* ═══════════════════════════════════════════════════════════════════════════════════════════════
   Rework v6: sistema e composição (Hallmark full redesign, app scope)
   Tipografia: Lexend (títulos e números) + IBM Plex Sans (texto), embutidas (sem rede).
   Superfícies: espaço em branco e linhas finas; cartões só para o que é clicável por si.
   Movimento: só estados, curvas próprias, três durações; nada na paleta nem ao mudar de vista.
   ═══════════════════════════════════════════════════════════════════════════════════════════════ */
:root {
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-display: "Lexend", "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --t-2xs: 12px; --t-xs: 13px; --t-sm: 14px; --t-base: 16px; --t-md: 17px; --t-lg: 20px; --t-xl: 24px; --t-2xl: 32px; --t-3xl: 40px;
  --lh: 1.6; --lh-tight: 1.12;
  --ease-out: cubic-bezier(.23, 1, .32, 1); --ease-in: cubic-bezier(.55, 0, 1, .45); --ease-in-out: cubic-bezier(.65, 0, .35, 1);
  --dur-micro: 120ms; --dur-short: 220ms; --dur-long: 420ms;
  --sidebar: 272px; --reader: 780px; --container: 1160px; --appbar: 60px;

  /* Claro: papel e tinta tingidos para o violeta Natixis (h 312) */
  --paper: oklch(0.986 0.004 312); --side: oklch(0.968 0.007 312); --fill: oklch(0.948 0.010 312);
  --line: oklch(0.905 0.012 312); --edge: oklch(0.660 0.020 312);
  --ink: oklch(0.205 0.025 312); --ink-2: oklch(0.370 0.020 312); --ink-3: oklch(0.505 0.015 312);
  --brand: oklch(0.366 0.145 312); --brand-strong: oklch(0.305 0.130 312); --brand-ink: oklch(0.986 0.004 312);
  --brand-soft: oklch(0.950 0.028 312); --brand-line: oklch(0.820 0.060 312); --brand-text: oklch(0.366 0.145 312);
  --ring: oklch(0.450 0.180 312);
  --shadow: 0 1px 2px oklch(0.2 0.02 312 / .06);
  --pop-shadow: 0 24px 64px -24px oklch(0.2 0.03 312 / .35), 0 0 0 1px oklch(0.2 0.02 312 / .06);
}
:root[data-theme="dark"] {
  --paper: oklch(0.165 0.012 312); --side: oklch(0.190 0.014 312); --fill: oklch(0.235 0.016 312);
  --line: oklch(0.285 0.016 312); --edge: oklch(0.500 0.020 312);
  --ink: oklch(0.955 0.008 312); --ink-2: oklch(0.850 0.012 312); --ink-3: oklch(0.700 0.014 312);
  --brand: oklch(0.740 0.110 312); --brand-strong: oklch(0.800 0.090 312); --brand-ink: oklch(0.165 0.012 312);
  --brand-soft: oklch(0.300 0.070 312); --brand-line: oklch(0.450 0.090 312); --brand-text: oklch(0.820 0.090 312);
  --ring: oklch(0.760 0.120 312);
  --pop-shadow: 0 24px 64px -24px oklch(0 0 0 / .7), 0 0 0 1px oklch(0.955 0.008 312 / .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: oklch(0.165 0.012 312); --side: oklch(0.190 0.014 312); --fill: oklch(0.235 0.016 312);
    --line: oklch(0.285 0.016 312); --edge: oklch(0.500 0.020 312);
    --ink: oklch(0.955 0.008 312); --ink-2: oklch(0.850 0.012 312); --ink-3: oklch(0.700 0.014 312);
    --brand: oklch(0.740 0.110 312); --brand-strong: oklch(0.800 0.090 312); --brand-ink: oklch(0.165 0.012 312);
    --brand-soft: oklch(0.300 0.070 312); --brand-line: oklch(0.450 0.090 312); --brand-text: oklch(0.820 0.090 312);
    --ring: oklch(0.760 0.120 312);
    --pop-shadow: 0 24px 64px -24px oklch(0 0 0 / .7), 0 0 0 1px oklch(0.955 0.008 312 / .06);
  }
}

/* ── Tipografia ── */
body { font-family: var(--font-ui); font-size: var(--t-base); line-height: var(--lh); font-synthesis: none; font-feature-settings: "kern"; }
h1, h2, h3, .page h1, .display { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.02em; }
.page h1 { font-size: var(--t-2xl); line-height: var(--lh-tight); max-width: 24ch; }
.page-sub { font-size: var(--t-md); color: var(--ink-2); max-width: 62ch; margin-top: var(--s-3); }
.page-head { margin-bottom: var(--s-10); align-items: flex-end; }
::selection { background: var(--brand-soft); color: var(--ink); }

/* ── Moldura: barra superior em todas as larguras, uma só ação principal por página ── */
#main { display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: var(--s-3); position: sticky; top: 0; z-index: 20; min-height: var(--appbar); padding: 0 var(--s-6) 0 var(--s-8); background: color-mix(in oklch, var(--paper) 88%, transparent); backdrop-filter: saturate(1.2) blur(10px); border-bottom: 1px solid var(--line); }
.topbar strong { flex: 1; font-family: var(--font-display); font-weight: 600; font-size: var(--t-md); letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#menu-btn { display: none; }
.topbar-actions { display: flex; align-items: center; gap: var(--s-2); }
.go-btn { display: inline-flex; align-items: center; gap: var(--s-2); min-height: 36px; padding: 0 var(--s-2) 0 var(--s-3); border: 1px solid var(--line); border-radius: var(--r-md); background: var(--paper); color: var(--ink-3); font-size: var(--t-sm); }
.go-btn .kbd { margin-left: var(--s-4); }
#view { flex: 1; }
.page { padding: var(--s-12) var(--s-10) var(--s-16); }

/* Barra lateral: marca, pesquisa, vistas e lista de reuniões */
#sidebar { background: var(--side); }
.brand { padding: var(--s-6) var(--s-6) var(--s-5); gap: var(--s-4); }
.brand-logo { max-width: 180px; }
.brand-team b { font-family: var(--font-display); font-weight: 600; font-size: var(--t-sm); letter-spacing: -0.005em; }
.brand-team span { font-size: var(--t-xs); }
.nav { padding: 0 var(--s-3) var(--s-4); gap: 1px; }
.nav a { min-height: 38px; font-size: var(--t-sm); color: var(--ink-2); font-weight: 400; }
.nav a .icon { color: var(--ink-3); }
.nav a[aria-current="page"] { background: var(--paper); color: var(--ink); font-weight: 600; box-shadow: var(--shadow), 0 0 0 1px var(--line); }
.nav a[aria-current="page"] .icon { color: var(--brand-text); }
.list-head { padding: var(--s-5) var(--s-4) var(--s-2); }
.list-title { font-size: var(--t-xs); font-weight: 600; color: var(--ink-3); }
.input { height: 38px; font-size: var(--t-sm); border-color: var(--line); background: var(--paper); }
.input:hover { border-color: var(--edge); }
#list { padding: 0 var(--s-3) var(--s-6); scroll-padding-top: 2.5rem; }
.list-label { padding: var(--s-4) var(--s-3) var(--s-1); color: var(--ink-3); font-weight: 600; font-size: var(--t-2xs); }
.m-item { padding: var(--s-2) var(--s-3); gap: 3px; }
.m-title { font-size: var(--t-sm); font-weight: 500; }
.m-meta { font-size: var(--t-2xs); }
.m-item[aria-current="page"] { background: var(--paper); box-shadow: var(--shadow), 0 0 0 1px var(--line); }
.m-item[aria-current="page"] .m-title { color: var(--ink); font-weight: 600; }
.side-foot { padding: var(--s-3) var(--s-4); }

/* ── Controlos ── */
.btn { min-height: 38px; padding: 0 var(--s-4); border-radius: var(--r-md); border-color: var(--line); font-size: var(--t-sm); font-weight: 600; box-shadow: var(--shadow); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); box-shadow: 0 1px 0 oklch(1 0 0 / .12) inset, var(--shadow); }
.btn-lg { min-height: 44px; padding: 0 var(--s-5); font-size: var(--t-base); }
.btn-link { font-weight: 600; text-decoration-thickness: 1px; }
.badge { min-height: 22px; padding: 0 var(--s-2); border-radius: 5px; font-size: var(--t-2xs); font-weight: 600; letter-spacing: 0; }
.chip { min-height: 30px; font-size: var(--t-xs); border-color: var(--line); }
.kbd { font-family: var(--font-ui); font-size: var(--t-2xs); }

/* ── Superfícies: secções com linha fina em vez de cartões ── */
.panel { background: none; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: var(--s-6) 0 0; }
.panel-head { margin-bottom: var(--s-5); align-items: baseline; }
.panel-head h2, .r-sec > h2, .r-body h2, .task-group h2 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; }
.panel-head h2 { font-size: var(--t-lg); }
.panel-head p { font-size: var(--t-xs); color: var(--ink-3); }
.stack { gap: var(--s-12); }
.cols-2 { gap: var(--s-12); }
.cols-3 { gap: var(--s-8) var(--s-10); }
details.panel > summary.panel-head { margin: 0; }

/* Números: uma linha com divisórias finas, sem caixa */
.stats { border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); border-radius: 0; background: none; }
.stat { padding: var(--s-5) var(--s-6); }
.stat:first-child { padding-left: 0; }
.stat-v { font-family: var(--font-display); font-weight: 600; font-size: var(--t-2xl); letter-spacing: -0.025em; line-height: 1.05; }
.stat-l { font-size: var(--t-sm); color: var(--ink-2); margin-top: var(--s-2); }
.stat-h { font-size: var(--t-xs); }

/* Tabelas: só linhas horizontais, sem moldura */
.tbl th, .r-body th { font-size: var(--t-xs); font-weight: 600; color: var(--ink-3); background: none; border-bottom: 1px solid var(--edge); padding-top: 0; }
.tbl td, .r-body td { font-size: var(--t-sm); padding-top: var(--s-3); padding-bottom: var(--s-3); }
.tbl td:first-child, .tbl th:first-child { padding-left: 0; }
.tbl td:last-child, .tbl th:last-child { padding-right: 0; }

/* Linhas de listas */
.row-link { padding: var(--s-4) 0; }
.row-title { font-weight: 600; }
.row-sub { margin-top: 2px; }

/* Reunião */
.r-title-row h1 { font-size: var(--t-2xl); }
.r-meta { font-size: var(--t-sm); margin-top: var(--s-4); }
.r-body > section, .r-sec + .r-sec, .r-body > .r-sec { margin-top: var(--s-12); }
.r-sec > h2, .r-body h2 { font-size: var(--t-xl); margin-bottom: var(--s-5); }
.r-body h3 { font-size: var(--t-base); font-family: var(--font-ui); letter-spacing: 0; }
.r-body p, .r-body li { font-size: var(--t-base); }
.lead { font-size: var(--t-lg) !important; line-height: 1.55; font-weight: 400; letter-spacing: -0.005em; }
.ribbon { margin: var(--s-8) 0 var(--s-2); }
.ribbon-track { height: 40px; border-radius: var(--r-md); }
.radar { border-top: 2px solid var(--brand); padding-top: var(--s-8); }
.radar-stats { border: 0; border-top: 1px solid var(--line); border-radius: 0; background: none; }
.radar-stat { box-shadow: none; border-bottom: 1px solid var(--line); padding: var(--s-4) var(--s-4) var(--s-4) 0; }
.radar-stat .v { font-family: var(--font-display); font-size: var(--t-xl); letter-spacing: -0.02em; }
.tip { border-radius: var(--r-md); padding: var(--s-4) var(--s-5); }
.decision, .risk, .todo-item, .task { padding-top: var(--s-4); padding-bottom: var(--s-4); }
.time-btn { border-radius: 5px; }

/* Início: uma frase que resume a semana, e a última reunião como peça principal */
.home-h1 { font-size: var(--t-3xl) !important; max-width: 18ch !important; }
.home-lead { font-size: var(--t-lg); line-height: 1.5; color: var(--ink-2); max-width: 54ch; margin: var(--s-4) 0 0; }
.home-lead b { color: var(--ink); font-weight: 600; }
.last-title { font-family: var(--font-display); font-weight: 600; font-size: var(--t-xl); letter-spacing: -0.015em; line-height: 1.2; text-decoration: none; display: inline-block; }
.health-row { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4) 0; border-top: 1px solid var(--line); text-decoration: none; }
.rows > .health-row:first-child { border-top: 0; padding-top: 0; }
.health-row .row-main { min-width: 0; }

/* Projetos: gráficos com mais respiro */
.chart .ax, .chart .mta-label { font-family: var(--font-ui); }

/* Assistente: os passos continuam a ser cartões (são interativos) */
.step { border-radius: var(--r-lg); box-shadow: var(--shadow); padding: var(--s-6) var(--s-8); }
.step-head h2 { font-size: var(--t-lg); }

/* ── Movimento: só estados (Emil Kowalski) ── */
@media (hover: hover) and (pointer: fine) {
  .nav a, .m-item, .chip, .icon-btn, .btn, .go-btn, .row-link, .health-row, .tag-btn, .person-btn, .pager a, .time-btn, .ribbon-key, .choice {
    transition: background-color var(--dur-short) var(--ease-in-out), color var(--dur-short) var(--ease-in-out), border-color var(--dur-short) var(--ease-in-out), box-shadow var(--dur-short) var(--ease-in-out), transform var(--dur-micro) var(--ease-out);
  }
  .btn.primary:hover { background: var(--brand-strong); border-color: var(--brand-strong); }
  .go-btn:hover { border-color: var(--edge); color: var(--ink); }
  .health-row:hover .row-title, .last-title:hover { color: var(--brand-text); }
  .m-item:hover { background: color-mix(in oklch, var(--paper) 70%, transparent); }
}
.btn:active, .icon-btn:active, .chip:active, .go-btn:active, .seg button:active, .ribbon-key:active, .time-btn:active { transform: scale(.97); }
.ribbon rect { transition: opacity var(--dur-short) var(--ease-in-out); }
.transcript summary .icon { transition: transform var(--dur-short) var(--ease-out); }
.toast { transform: translate(-50%, 8px); transition: opacity var(--dur-micro) var(--ease-in), transform var(--dur-micro) var(--ease-in); }
.toast.show { transform: translate(-50%, 0); transition: opacity var(--dur-short) var(--ease-out), transform var(--dur-short) var(--ease-out); }
.rag-cell { transition: opacity var(--dur-short) var(--ease-in-out); }
.rag-strip:hover .rag-cell:not(:hover) { opacity: .55; }
.todo-item input + span, .task-text { transition: color var(--dur-short) var(--ease-in-out); }

/* ── Ecrãs pequenos ── */
@media (max-width: 60rem) {
  .topbar { padding: 0 var(--s-2); padding-top: env(safe-area-inset-top); }
  #menu-btn { display: inline-grid; }
  .go-btn .label, .go-btn .kbd, .topbar .new-btn .label { display: none; }
  .go-btn { padding: 0 var(--s-2); border: 0; background: none; box-shadow: none; }
  .page { padding: var(--s-8) var(--s-4) var(--s-12); }
  .page h1, .r-title-row h1 { font-size: var(--t-xl); }
  .home-h1 { font-size: var(--t-2xl) !important; }
  .home-lead { font-size: var(--t-md); }
  .stat:first-child { padding-left: var(--s-4); }
  .stat { padding: var(--s-4); }
  .stack, .cols-2 { gap: var(--s-10); }
  .step { padding: var(--s-5) var(--s-4); }
}
@media (prefers-reduced-motion: reduce) { .toast, .toast.show { transition: none; } }

/* ═══════════════════════════════════════════════════════════════════════════════════════════════
   Toque v7: acabamento por cima do rework v6.
   Gradientes só em três sítios com significado: a ação principal, a fita de quem falou e o fio de
   marca no topo. O resto ganha profundidade com luz (realce interior, sombra tingida), não com cor.
   Violeta Natixis (h 312) a derivar para magenta (h 335), como no logótipo.
   ═══════════════════════════════════════════════════════════════════════════════════════════════ */
:root {
  --grad-brand: linear-gradient(135deg, oklch(0.440 0.165 318) 0%, oklch(0.366 0.145 312) 48%, oklch(0.300 0.120 300) 100%);
  --grad-thread: linear-gradient(90deg, oklch(0.366 0.145 312), oklch(0.520 0.190 335) 55%, oklch(0.700 0.160 40));
  --grad-soft: linear-gradient(135deg, oklch(0.960 0.026 318), oklch(0.975 0.012 340));
  --glow: oklch(0.366 0.145 312 / .28);
  --sheen: linear-gradient(180deg, oklch(1 0 0 / .22), oklch(1 0 0 / 0) 55%, oklch(0 0 0 / .06));
  --lift: 0 1px 0 oklch(1 0 0 / .7) inset, 0 1px 2px oklch(0.2 0.02 312 / .06), 0 4px 12px -6px oklch(0.2 0.03 312 / .14);
}
:root[data-theme="dark"] {
  --grad-brand: linear-gradient(135deg, oklch(0.820 0.100 320) 0%, oklch(0.740 0.120 312) 50%, oklch(0.660 0.130 300) 100%);
  --grad-thread: linear-gradient(90deg, oklch(0.740 0.110 312), oklch(0.700 0.160 335) 55%, oklch(0.780 0.130 45));
  --grad-soft: linear-gradient(135deg, oklch(0.270 0.060 318), oklch(0.220 0.030 340));
  --glow: oklch(0.740 0.110 312 / .30);
  --sheen: linear-gradient(180deg, oklch(1 0 0 / .16), oklch(1 0 0 / 0) 55%, oklch(0 0 0 / .10));
  --lift: 0 1px 0 oklch(1 0 0 / .05) inset, 0 1px 2px oklch(0 0 0 / .3), 0 6px 16px -8px oklch(0 0 0 / .6);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --grad-brand: linear-gradient(135deg, oklch(0.820 0.100 320) 0%, oklch(0.740 0.120 312) 50%, oklch(0.660 0.130 300) 100%);
    --grad-thread: linear-gradient(90deg, oklch(0.740 0.110 312), oklch(0.700 0.160 335) 55%, oklch(0.780 0.130 45));
    --grad-soft: linear-gradient(135deg, oklch(0.270 0.060 318), oklch(0.220 0.030 340));
    --glow: oklch(0.740 0.110 312 / .30);
    --sheen: linear-gradient(180deg, oklch(1 0 0 / .16), oklch(1 0 0 / 0) 55%, oklch(0 0 0 / .10));
    --lift: 0 1px 0 oklch(1 0 0 / .05) inset, 0 1px 2px oklch(0 0 0 / .3), 0 6px 16px -8px oklch(0 0 0 / .6);
  }
}

/* ── Fio de marca: 3 px no topo da janela, a assinatura Natixis ── */
#main::before { content: ""; position: sticky; top: 0; z-index: 21; display: block; height: 3px; background: var(--grad-thread); flex-shrink: 0; }
.topbar { top: 3px; }

/* ── Botões ── */
.btn { background-image: linear-gradient(180deg, var(--paper), color-mix(in oklch, var(--fill) 55%, var(--paper))); box-shadow: var(--lift); border-color: color-mix(in oklch, var(--line) 80%, var(--edge)); }
.btn.primary, .chip[aria-pressed="true"], .skip {
  background: var(--sheen), var(--grad-brand); background-size: 100% 100%, 160% 160%; background-position: 0 0, 0% 50%;
  border-color: transparent; color: var(--brand-ink);
  box-shadow: 0 1px 0 oklch(1 0 0 / .25) inset, 0 -1px 0 oklch(0 0 0 / .15) inset, 0 6px 18px -8px var(--glow), 0 1px 2px oklch(0.2 0.03 312 / .2);
  text-shadow: 0 1px 0 oklch(0 0 0 / .12);
}
.topbar .new-btn { border-color: var(--brand-line); color: var(--brand-text); }
.topbar .new-btn .icon { color: var(--brand-text); }
.go-btn { background-image: linear-gradient(180deg, var(--paper), color-mix(in oklch, var(--fill) 45%, var(--paper))); box-shadow: 0 1px 0 oklch(1 0 0 / .6) inset; }

/* Seletores segmentados: o escolhido levanta */
.seg { background: color-mix(in oklch, var(--fill) 85%, var(--line)); box-shadow: 0 1px 2px oklch(0.2 0.02 312 / .08) inset; }
.seg button[aria-pressed="true"] { box-shadow: var(--lift), 0 0 0 1px var(--line); }

/* Navegação: indicador de marca à esquerda do item ativo */
.nav a, .m-item { position: relative; }
.nav a[aria-current="page"]::before, .m-item[aria-current="page"]::before {
  content: ""; position: absolute; left: -1px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--grad-brand);
}
.nav a[aria-current="page"], .m-item[aria-current="page"] { box-shadow: var(--lift), 0 0 0 1px var(--line); }

/* ── Fita de quem falou: trilho fundo, segmentos em cápsula com brilho ── */
.ribbon-track { --pad: 5px; height: 48px; padding: 0; border-radius: 14px; background: color-mix(in oklch, var(--fill) 80%, var(--line)); box-shadow: 0 1px 3px oklch(0.2 0.02 312 / .12) inset, 0 0 0 1px var(--line); overflow: hidden; }
.ribbon-track .seg { position: absolute; top: var(--pad); bottom: var(--pad); left: calc(var(--pad) + (100% - 2 * var(--pad)) * var(--x)); width: calc((100% - 2 * var(--pad)) * var(--w)); min-width: 3px; border-inline: 1px solid transparent; background-clip: padding-box; border-radius: 7px;
  background-color: var(--c); background-image: linear-gradient(180deg, oklch(1 0 0 / .28), oklch(1 0 0 / 0) 50%, oklch(0 0 0 / .10));
  box-shadow: 0 1px 0 oklch(1 0 0 / .25) inset; transition: opacity var(--dur-short) var(--ease-in-out), filter var(--dur-short) var(--ease-in-out); }
.ribbon[data-focus] .seg { opacity: .16; filter: saturate(.4); }
.ribbon[data-focus="0"] .seg[data-s="0"], .ribbon[data-focus="1"] .seg[data-s="1"], .ribbon[data-focus="2"] .seg[data-s="2"], .ribbon[data-focus="3"] .seg[data-s="3"],
.ribbon[data-focus="4"] .seg[data-s="4"], .ribbon[data-focus="5"] .seg[data-s="5"], .ribbon[data-focus="6"] .seg[data-s="6"] { opacity: 1; filter: none; }
@media (hover: hover) and (pointer: fine) { .ribbon-track .seg:hover { filter: brightness(1.08) saturate(1.1); } }
.ribbon-axis { position: relative; margin-top: var(--s-2); padding: 0 5px; font-size: var(--t-2xs); }
.ribbon-axis span { position: relative; padding-top: 7px; }
.ribbon-axis span::before { content: ""; position: absolute; top: 0; left: 50%; width: 1px; height: 4px; background: var(--edge); opacity: .6; }
.ribbon-axis span:first-child::before { left: 0; } .ribbon-axis span:last-child::before { left: auto; right: 0; }
.ribbon-key { box-shadow: 0 1px 0 oklch(1 0 0 / .6) inset, 0 1px 2px oklch(0.2 0.02 312 / .05); }
.ribbon-key .key, .key { width: 10px; height: 10px; border-radius: 50%; background-image: linear-gradient(180deg, oklch(1 0 0 / .35), oklch(1 0 0 / 0) 60%); box-shadow: 0 0 0 3px color-mix(in oklch, var(--c) 18%, transparent); }
.ribbon-key[aria-pressed="true"] { background: var(--grad-soft); border-color: var(--brand-line); }

/* Pistas por pessoa (Participação) */
.lane { --pad: 3px; position: relative; height: 16px; border-radius: 8px; background: color-mix(in oklch, var(--fill) 80%, var(--line)); box-shadow: 0 1px 2px oklch(0.2 0.02 312 / .1) inset; }
.lane i { position: absolute; top: var(--pad); bottom: var(--pad); left: calc(var(--pad) + (100% - 2 * var(--pad)) * var(--x)); width: calc((100% - 2 * var(--pad)) * var(--w)); min-width: 2px; border-radius: 5px; background: var(--c); background-image: linear-gradient(180deg, oklch(1 0 0 / .3), oklch(1 0 0 / 0) 60%); }

/* Barras horizontais (bordões): cápsula com degradê e ponta luminosa */
.hbar-track { height: 10px; background: color-mix(in oklch, var(--fill) 80%, var(--line)); box-shadow: 0 1px 2px oklch(0.2 0.02 312 / .1) inset; }
.hbar-track i { background: linear-gradient(90deg, color-mix(in oklch, var(--coral) 55%, var(--paper)), var(--coral)); box-shadow: 0 0 10px -2px color-mix(in oklch, var(--coral) 60%, transparent); }

/* Estado reunião a reunião (RAG) */
.rag-cell { border-radius: 6px; background-image: linear-gradient(180deg, oklch(1 0 0 / .25), oklch(1 0 0 / 0) 55%, oklch(0 0 0 / .08)); box-shadow: 0 1px 0 oklch(1 0 0 / .2) inset; }

/* Gráficos: linhas com uma sombra da própria cor */
.chart .mta-line { filter: drop-shadow(0 3px 4px color-mix(in oklch, var(--c) 35%, transparent)); stroke-width: 2.25; stroke-linecap: round; }
.chart .bar-new { filter: drop-shadow(0 2px 3px oklch(0.2 0.02 312 / .15)); }

/* ── Superfícies com intenção ── */
.callout { background: var(--grad-soft); box-shadow: 0 0 0 1px color-mix(in oklch, var(--brand-line) 45%, transparent) inset; }
.tip { background: var(--grad-soft); box-shadow: 0 0 0 1px color-mix(in oklch, var(--brand-line) 45%, transparent) inset; position: relative; overflow: hidden; }
.tip::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--grad-brand); }
.radar { border-top: 0; position: relative; }
.radar::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; border-radius: 2px; background: var(--grad-thread); }
.stats { position: relative; border-top: 0; }
.stats::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, var(--brand), color-mix(in oklch, var(--brand) 30%, var(--line)) 40%, var(--line)); }
.stat-v { background: linear-gradient(180deg, var(--ink), color-mix(in oklch, var(--ink) 70%, var(--brand))); -webkit-background-clip: text; background-clip: text; color: transparent; }
.badge { box-shadow: 0 0 0 1px color-mix(in oklch, currentColor 14%, transparent) inset; }
.avatar { background-image: linear-gradient(180deg, oklch(1 0 0 / .25), oklch(1 0 0 / 0) 60%); box-shadow: 0 0 0 2px var(--paper), 0 1px 3px oklch(0.2 0.02 312 / .2); }

/* Início: uma luz ténue de marca atrás do título, sem cartão */
.page-head:has(.home-h1) { position: relative; isolation: isolate; }
.page-head:has(.home-h1)::before { content: ""; position: absolute; z-index: -1; left: -10%; top: -60%; width: min(680px, 90vw); height: 320px; background: radial-gradient(closest-side, color-mix(in oklch, var(--brand) 14%, transparent), transparent); pointer-events: none; }
.home-lead b { background-image: linear-gradient(transparent 66%, color-mix(in oklch, var(--brand) 10%, transparent) 66%); }

/* Passos do assistente: o passo atual ganha borda em degradê */
.step { box-shadow: var(--lift), 0 0 0 1px var(--line); border-color: transparent; }
.step:focus-within { border: 1px solid transparent; background: linear-gradient(var(--paper), var(--paper)) padding-box, var(--grad-brand) border-box; }

/* Lista lateral: o mês fixo esbate o que passa por baixo em vez de o cortar a seco */
.list-label { background: linear-gradient(var(--side) 70%, color-mix(in oklch, var(--side) 0%, transparent)); padding-bottom: var(--s-3); margin-bottom: calc(-1 * var(--s-2)); }

/* Paleta de comandos e avisos */
#cmdk .cmdk-item[aria-selected="true"] { background: var(--grad-soft); box-shadow: 0 0 0 1px var(--brand-line) inset; }
.toast { background: var(--sheen), oklch(0.220 0.030 312); box-shadow: 0 10px 30px -10px oklch(0.2 0.05 312 / .5), 0 0 0 1px oklch(1 0 0 / .06) inset; }

/* ── Movimento (Emil Kowalski): a luz desloca-se no hover, nada de saltos ── */
@media (hover: hover) and (pointer: fine) {
  .btn.primary, .chip[aria-pressed="true"] { transition: background-position var(--dur-long) var(--ease-out), box-shadow var(--dur-short) var(--ease-out), transform var(--dur-micro) var(--ease-out); }
  .btn.primary:hover { background: var(--sheen), var(--grad-brand); background-size: 100% 100%, 160% 160%; background-position: 0 0, 100% 50%; box-shadow: 0 1px 0 oklch(1 0 0 / .25) inset, 0 -1px 0 oklch(0 0 0 / .15) inset, 0 10px 24px -8px var(--glow), 0 1px 2px oklch(0.2 0.03 312 / .2); }
  .btn:not(.primary):hover { border-color: var(--edge); }
  .topbar .new-btn:hover { background: var(--grad-soft); }
}
@media (prefers-reduced-motion: reduce) { .btn.primary, .ribbon-track .seg { transition: none; } }

/* ── Impressão: sem efeitos ── */
@media print {
  #main::before, .page-head::before { display: none !important; }
  .stat-v { color: var(--ink); background: none; }
}

/* Gráficos de evolução: linha com sombra e área em degradê por baixo */
.chart .line { stroke-width: 2.25; filter: drop-shadow(0 3px 4px var(--glow)); }
.chart circle { stroke-width: 2; }
.chart circle.last { filter: drop-shadow(0 0 4px var(--glow)); }
.chart .band { opacity: .85; }
@media (max-width: 60rem) { .go-btn { background-image: none; box-shadow: none; } }
